# Future base preset F_wg100: single-pass waveguide OPA (Ref A-type 45 mm PPLN stand-in), ps pulses at 100 MHz,
# Pockels block demux N_b = 50, single-mode spectral filter + per-port dispersion compensation, L-Liu + TEC
# (WP-I5, M4–M6; 00_summary §2.2 column F_wg100; D07, D39, D44, D45). Shared loop: F_common.yaml.
#
#   source   opa_supermodes: 45 mm PPLN (Ref A stand-in, α = 9.06 /W [Ref A]), τ_p = 1 ps (100 fs–10 ps, D07), bulk-LN
#            GVM 0.304 ps/mm, β2 101 / 388 fs²/mm (T03 §5.1, UNVERIFIED for the waveguide). The toggle `multimode`
#            is OFF here: the M4 single-mode stand-in r = √(α P_pk) (T03 V5, bit-identical to the §7-1 model).
#            presets/axes/source/waveguide_opa_multimode.yaml turns the supermodes on (T03: τ_p ≪ τ_GVM = 13.7 ps
#            makes the output strongly multimode, K ≈ 200 at low gain — the physics the stand-in hides).
#   f_rep    100 MHz; demux Pockels block N_b = 50 (first stage at f_rep/(2N_b) = 1 MHz ≤ f_tog,max; L_31 ≈ 3.17 km, E50)
#            CHK: N_b = 1 at 100 MHz is infeasible (demux_toggle_rate; presets/axes/demux/pockels_tree.yaml shows it)
#   filters  single-mode spectral filter (N15) and per-port dispersion compensation (N16): insertion losses [AE]
#   lock     L-Liu + TEC, actuators upstream (F_common); pump: L-LiuPD-A crystal option (a) = crystal at ≈ 1 mK
#            (env.thermal.xtal in F_common; presets/locks/L-LiuPD-A_a.yaml adds the PD-OPA reference–pump lock)
#   LO / BHD pulsed LO split + delay shaped to the supermode (lo_temporal_shape `optimal`), pulse-resolved GHz BHD
extends: F_common

preset: F_wg100

offline:
  params:
    # --- design (00_summary §2.2) -------------------------------------------------------------------------------
    f_rep_hz: 1.0e+8                      # 00_summary §2.2
    N_b: 50                               # T11 §7: N_b ≥ f_rep/(2 f_tog,max) = 50 at 1 MHz
    n_guard: 0
    n_sub_fiber: 64                       # δ = τ_k/N_sub ≈ 0.24 µs at 3.17 km (PLAN §6.4)
    L_xtal_m: 0.045                       # [Ref A] 45 mm PPLN
    n_g_xtal: 2.182                       # bulk LN at 1545 nm (T03 §5.1)
    tau_p_s: !sweep_log [1.0e-13, 1.0e-11, 3]   # D07: 100 fs – 10 ps (00_summary §2.2: 1 ps)
    tau_mode_s: !expr "tau_p_s"           # mode length ≈ pulse width (single-mode stand-in) [AE]
    f_max_metric_hz: !expr "1.0 / tau_p_s"   # conv §6: flat source range ~ 1/τ_p
    # --- source (T03 §5; Ref A) ---------------------------------------------------------------------------------------
    opa_alpha_per_w: 9.06                 # [Ref A] 906 %/W (D48)
    opa_peak_pump_w: !sweep_log [0.05, 0.5, 3]   # peak pump [AE]: r = √(α P_pk) = 0.67–2.1 in the stand-in
    opa_gvm_s_per_m: 3.04e-10             # T03 §5.1 (bulk LN, 0.304 ps/mm)
    opa_beta2_s_s2_per_m: 1.01e-25        # T03 §5.1 (101 fs²/mm)
    opa_beta2_p_s2_per_m: 3.88e-25        # T03 §5.1 (388 fs²/mm)
    opa_n_points: 256                     # grid for the multimode overlay (T03 §5.2 needs 2400–3200 for ps pumps:
                                          # 256 is a coarse, fast grid — convergence is the overlay user's job) [AE]
    opa_window_s: !expr "40 * tau_p_s"
    # --- demux: Pockels-cell block switch (T11 §2, pockels_pbs_tree) ---------------------------------------------------
    dmx_layout: tree
    dmx_switching: active
    dmx_n_stages: 5
    dmx_t_stage: !sweep [0.96, 0.99, 3]
    dmx_er_db: !sweep [20.0, 23.0, 3]
    dmx_t_rise_s: !sweep [8.0e-9, 1.0e-8, 3]   # edge + 6σ_j + τ_mode must fit (1 + n_guard)·T_rep = 10 ns: 10 ns warns (CHK)
    dmx_sigma_j_s: 1.0e-10                # [AE]
    dmx_f_tog_max_hz: !sweep [5.0e+5, 3.0e+6, 3]
    # --- filters (D44, N15 / N16) ----------------------------------------------------------------------------------------
    spf_bandwidth_hz: !expr "0.441 / tau_p_s"   # transform-limited Gaussian FWHM bandwidth [AE]
    spf_eta: 0.97                         # insertion [AE] UNVERIFIED
    dc_eta: 0.98                          # per-port dispersion compensator insertion [AE] UNVERIFIED
    # --- LO / BHD (D45; 00_summary §2.2: GHz-class pulse-resolved BHD) --------------------------------------------------
    bhd_bandwidth_hz: !sweep [1.0e+9, 3.0e+9, 3]
    bhd_gate_s: !expr "1.0 / f_rep_hz"    # one slot
    lo_shape: optimal                     # shaped to the supermode (00_summary §2.2)

  blocks:
    - block: opa_supermodes
      name: src
      params:
        length_m: !expr "offline.params.L_xtal_m"
        alpha_per_w: !expr "offline.params.opa_alpha_per_w"
        peak_pump_w: !expr "offline.params.opa_peak_pump_w"
        pump_fwhm_s: !expr "offline.params.tau_p_s"
        gvm_s_per_m: !expr "offline.params.opa_gvm_s_per_m"
        beta2_signal_s2_per_m: !expr "offline.params.opa_beta2_s_s2_per_m"
        beta2_pump_s2_per_m: !expr "offline.params.opa_beta2_p_s2_per_m"
        n_points: !expr "offline.params.opa_n_points"
        time_window_s: !expr "offline.params.opa_window_s"
        n_z: 20                         # [AE]
        phi_opa0_rad: 0.0               # conv §4
        segment: XTAL
        psi_p_xtal_rad: 0.0             # crystal pump phase (time loop: XTAL dT coefficient)
        toggles: {multimode: false, gvm: true, gvd: true}   # M4 stand-in (header)
    - block: spectral_filter            # single-mode filter before the GBS (D44, N15)
      name: spf
      params:
        shape: gauss
        bandwidth_hz: !expr "offline.params.spf_bandwidth_hz"
        center_hz: 0.0
        insertion_eta: !expr "offline.params.spf_eta"
        segment: UP
        applies_to: [gbs, bhd]
        source_tag: "D44 / N15 single-mode filter; insertion [AE] UNVERIFIED"
        pad: 2
        toggles: {enabled: true}
    - block: dispersion_comp            # per-port GDD compensation of L_k (D44, N16)
      name: dcomp
      params:
        ports:
          "0": {gdd_s2: !expr "2.17e-26 * offline.params.L_0_m", tod_s3: 0.0, delay_s: 0.0, segment: G0,
                insertion_eta: !expr "offline.params.dc_eta"}
          "1": {gdd_s2: !expr "2.17e-26 * offline.params.L_k_m", tod_s3: 0.0, delay_s: 0.0, segment: G1,
                insertion_eta: !expr "offline.params.dc_eta"}
        applies_to: [gbs, bhd]
        source_tag: "D44 / N16 per-port dispersion compensation; insertion [AE] UNVERIFIED"
        toggles: {enabled: true}
    - block: lo_temporal_shape          # LO shaped to the (Gaussian stand-in) mode (D45)
      name: lo_shape
      params:
        source: {gaussian: {T0_s: !expr "offline.params.tau_p_s / (2 * sqrt(log(2)))", r: 1.0, n_points: 256,
                            window_s: !expr "20 * offline.params.tau_p_s", phi_opa0_rad: 0.0}}
        shape: !expr "offline.params.lo_shape"
        fit: true
        observer: gbs
        source_tag: "D45 pulsed LO shaped to the mode; Gaussian single-mode stand-in [AE]"
        eta_t_carrier: registry         # metrics read η_t from the LossRegistry (D72-1)
        toggles: {shape_mismatch: true}
    - block: pulsed_bhd_kernel          # pulse-resolved GHz BHD (T13 §1.8)
      name: bhd_kernel
      params:
        f_rep_hz: !expr "offline.params.f_rep_hz"
        response: {model: first_order, bandwidth_hz: !expr "offline.params.bhd_bandwidth_hz"}
        window_s: !expr "offline.params.bhd_gate_s"
        n_taps: 4
        sigma_el_e: 300.0               # [AE]
        n_lo_photons: 1.0e+8            # [AE]
        qe: !expr "offline.params.qe_bhd"
        mode_length_s: !expr "offline.params.tau_mode_s"
        toggles: {pulsed_crosstalk: true, circuit_noise: true}
