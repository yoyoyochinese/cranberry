# Shared skeleton of the future (32-port GBS) presets F_wg100 / F_wg6 / F_bor6 / F_liu20 (WP-I5; PLAN §5.4,
# §7.1; 00_summary §2.2–§2.4; D08–D13, D30–D32, D38–D47, D50, D53). NOT a preset of its own and not a default
# (D34): it holds the time loop and the offline blocks every future base preset shares; each base preset
# `extends:` it and adds its source, repetition rate, demultiplexer, filters, LO / BHD and checks. It does not
# validate alone (no `src` block, no design values).
#
# Configuration: reference port 0 + port k (G13 / D54; D13 "1 port, L_k swept"): topology port index 1 IS
# port k of the 32-port design (its port number is `offline.params.port_k`; the index stays 1 so the metric
# names i.port1 / ii.port1 do not depend on the sweep). The 2-port pair of D13 (two long ports with
# correlated fibre noise ρ and delay difference Δτ) is the overlay presets/axes/ports/pair.yaml.
#
#   laser φ_L ─┬─ PUMP (SHG → squeezer, θ-units) ─ XTAL (squeezer crystal / OPO) ─ UP (squeezed only) ─┬─ DMX0 ─ D0 ─ F0 (L_0) ─ G0 ─► GBS 0
#              │                                                                                     └─ DMX1 ─ EM1 ─ D1 ─ F1 (L_k) ─ G1 ─► GBS k
#              ├─ PRsrc (probe source: same laser, AOM gate) ─ PRS0 / PRS1 (split, common point 1) ─► PBS_k ─► F_k (d = −1, fast axis) ─► D_k (d = −1) ─► det_k
#              └─ REF (common reference delivery, common point 2) ─┬─ REF0 / REF1 ─► det_k   (lock L_k: φ_pr,k − φ_ref,k = π/2, Liu-type L-Liu, D30)
#                                                                  └─ LO0 / (EM1, LO1) ─► BHD_k at the GBS input  (LO_k from the reference, D09)
#   actuators of port k (D10, D41): fibre stretcher at the upstream end of F_k (x_a = subsegment 0, "upstream", 00_summary §2.2)
#   fed by the fine PID; the TEC on the spool of F_k (writes ΔT, G08) fed by the slow PID offloading the PZT (stack, T16 §4.4).
#   EM1: zero-length marker crossed by sqz1 and lo1 only: the laser decorrelation above the loop's Nyquist frequency is
#   declared on it (laser_source oob_pairs), so it enters metric (ii) of port k and cancels in metric (i) (D31-3, D47, G05).
#
# Conventions (conv §9–§10, D56-4): every beam is emitted by the one laser `laser` (probe and reference "same laser",
# D40; overlay probe/other_laser.yaml); squeezed beams carry θ_sq, the pump path PUMP/XTAL is written in θ-units
# (½ of the pump phase). Locks start from X = 0 and acquire X = +π/2 (side of the fringe, dv/dX = −K < 0, positive
# integrator gain), so each stretcher holds ≈ +π/2 and metric (i) has the set point −π/2 (metric (ii): 0).
# Metric (ii) components (G13, runner.decompose; conv §10): (1) locked path F_k, D_k + loop sensor noise,
# (2) common points PRsrc, PRS_k, REF, REF_k, (3) laser decorrelation (fm_white), (4) squeezed only: PUMP, XTAL,
# UP, DMX_k (demux switch phase), G_k.
#
# Every value carries its source: Dnn decisions; Txx notes; [AE] agent estimate; UNVERIFIED = no primary
# document. Open quantities are NAMED SWEEP AXES under offline.params (D34, refC/refD pattern); a run needs a
# point (runner.sweep, or the *_nominal presets which apply presets/future/points/F_common_nominal.yaml).
# Loop delay (D55-1, D61-2): total = tau_s + 1/f_sim per actuator path; no block models a part of τ_L explicitly.

run:
  duration_s: 0.05           # tests shorten / lengthen it (TEC dynamics need seconds: bad_orth_pm_no_tec)
  f_sim_hz: 1.0e+6           # G10: future 1–4 MHz (f_N = 500 kHz ≫ the 10 kHz class loop band)
  chunk_samples: 65536       # results independent of it (VT-F2)
  seed: 20261101
  seed_mode: per_point       # D56-2

topology:
  segments:
    # ---- squeezer side (θ-units on the pump path) -------------------------------------------------------------
    - {id: PUMP, kind: free_space, L_m: !expr "offline.params.L_pump_m", n_g: 1.0003, beta2_s2_per_m: 0.0, beta3_s3_per_m: 0.0,
       zone: squeezer, n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}   # SHG → squeezer [AE]
    - {id: XTAL, kind: crystal, L_m: !expr "offline.params.L_xtal_m", n_g: !expr "offline.params.n_g_xtal", beta2_s2_per_m: 0.0,
       beta3_s3_per_m: 0.0, zone: squeezer, n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {},
       drivers: {dT: uniform}}                                       # crystal temperature (D42 crystal option (a), T01 N03)
    - {id: UP, kind: free_space, L_m: !expr "offline.params.L_up_m", n_g: 1.0003, beta2_s2_per_m: 0.0, beta3_s3_per_m: 0.0,
       zone: squeezer, n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}   # squeezer → demux, squeezed only [AE]
    - {id: DMX0, kind: demux, L_m: 0.0, n_g: 1.0, beta2_s2_per_m: 0.0, beta3_s3_per_m: 0.0, zone: demux, n_sub: 1, spatial: lumped,
       pol_model: "off", pol_params: {}, drivers: {eom: uniform}}   # demux stages of port 0 (Pockels / LN drive phase, T11 §3.5)
    - {id: DMX1, kind: demux, L_m: 0.0, n_g: 1.0, beta2_s2_per_m: 0.0, beta3_s3_per_m: 0.0, zone: demux, n_sub: 1, spatial: lumped,
       pol_model: "off", pol_params: {}, drivers: {eom: uniform}}   # demux stages of port k
    - {id: EM1, kind: component, L_m: 0.0, n_g: 1.0, beta2_s2_per_m: 0.0, beta3_s3_per_m: 0.0, zone: demux, n_sub: 1, spatial: lumped,
       pol_model: "off", pol_params: {}, drivers: {}}               # laser-decorrelation ledger marker (header)
    # ---- port paths (probe extraction near the demux → delay fibre → probe injection PBS_k → GBS) ---------------
    - {id: D0, kind: free_space, L_m: !expr "offline.params.L_d_m", n_g: 1.0003, beta2_s2_per_m: 0.0, beta3_s3_per_m: 0.0, zone: demux,
       n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}   # demux → probe extraction [AE]
    - {id: D1, kind: free_space, L_m: !expr "offline.params.L_d_m", n_g: 1.0003, beta2_s2_per_m: 0.0, beta3_s3_per_m: 0.0, zone: demux,
       n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}
    - {id: F0, kind: pm, L_m: !expr "offline.params.L_0_m", n_g: !expr "offline.params.n_g", beta2_s2_per_m: -2.17e-26,
       beta3_s3_per_m: 1.27e-40, zone: spool0, n_sub: !expr "offline.params.n_sub_F0", spatial: mixed, pol_model: pm_diagonal, actuator_sub: 0,
       pol_params: {K_T_rad_per_m_K: !expr "offline.params.K_T_pm_rad_per_m_K", K_tau_s_per_m_K: -1.78e-15,
                    b_g_s_per_m: 1.36e-12, axis_drivers: [dT, tec]},          # PM15-U25D: K_τ, b_g Ritari 2004 (T09 §1.3)
       drivers: {dT: uniform, strain: per_sub, stretcher: actuator, tec: uniform}}   # β2/β3 SMF stand-in (D49, T06)
    - {id: F1, kind: pm, L_m: !expr "offline.params.L_k_m", n_g: !expr "offline.params.n_g", beta2_s2_per_m: -2.17e-26,
       beta3_s3_per_m: 1.27e-40, zone: spool1, n_sub: !expr "offline.params.n_sub_fiber", spatial: mixed, pol_model: pm_diagonal,
       actuator_sub: 0,
       pol_params: {K_T_rad_per_m_K: !expr "offline.params.K_T_pm_rad_per_m_K", K_tau_s_per_m_K: -1.78e-15,
                    b_g_s_per_m: 1.36e-12, axis_drivers: [dT, tec]},
       drivers: {dT: uniform, strain: per_sub, stretcher: actuator, tec: uniform}}   # TEC on the whole spool (L_h = L_k, D41) [AE]
    - {id: G0, kind: free_space, L_m: !expr "offline.params.L_g_m", n_g: 1.0003, beta2_s2_per_m: 0.0, beta3_s3_per_m: 0.0, zone: gbs,
       n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}   # PBS_0 → GBS input, squeezed only [AE]
    - {id: G1, kind: free_space, L_m: !expr "offline.params.L_g_m", n_g: 1.0003, beta2_s2_per_m: 0.0, beta3_s3_per_m: 0.0, zone: gbs,
       n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}
    # ---- probe and reference distribution (common points, D31-2) -------------------------------------------------
    - {id: PRsrc, kind: pm, L_m: !expr "offline.params.L_prsrc_m", n_g: !expr "offline.params.n_g", beta2_s2_per_m: 0.0,
       beta3_s3_per_m: 0.0, zone: gbs, n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}
    - {id: PRS0, kind: pm, L_m: !expr "offline.params.L_prs_m", n_g: !expr "offline.params.n_g", beta2_s2_per_m: 0.0,
       beta3_s3_per_m: 0.0, zone: gbs, n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}
    - {id: PRS1, kind: pm, L_m: !expr "offline.params.L_prs_m", n_g: !expr "offline.params.n_g", beta2_s2_per_m: 0.0,
       beta3_s3_per_m: 0.0, zone: gbs, n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}
    - {id: REF, kind: pm, L_m: !expr "offline.params.L_ref_m", n_g: !expr "offline.params.n_g", beta2_s2_per_m: 0.0,
       beta3_s3_per_m: 0.0, zone: demux, n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}
    - {id: REF0, kind: pm, L_m: !expr "offline.params.L_refk_m", n_g: !expr "offline.params.n_g", beta2_s2_per_m: 0.0,
       beta3_s3_per_m: 0.0, zone: demux, n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}
    - {id: REF1, kind: pm, L_m: !expr "offline.params.L_refk_m", n_g: !expr "offline.params.n_g", beta2_s2_per_m: 0.0,
       beta3_s3_per_m: 0.0, zone: demux, n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {strain: uniform}}
    # ---- LO_k delivery (from the reference point, delay matched to the squeezed path, D09 / D51-6) ----------------
    - {id: LO0, kind: pm, L_m: !expr "offline.params.L_lo0_m", n_g: !expr "offline.params.n_g", beta2_s2_per_m: -2.17e-26,
       beta3_s3_per_m: 1.27e-40, zone: lospool, n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {},
       drivers: {dT: uniform, strain: uniform}}
    - {id: LO1, kind: pm, L_m: !expr "offline.params.L_lo1_m", n_g: !expr "offline.params.n_g", beta2_s2_per_m: -2.17e-26,
       beta3_s3_per_m: 1.27e-40, zone: lospool, n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {},
       drivers: {dT: uniform, strain: uniform}}
  beams:
    - {id: sqz0, source: laser, freq_offset_hz: 0.0, jones_in: [1, 0], power_w: 0.0, observer: gbs,
       path: [{segment: PUMP, direction: 1}, {segment: XTAL, direction: 1}, {segment: UP, direction: 1},
              {segment: DMX0, direction: 1}, {segment: D0, direction: 1}, {segment: F0, direction: 1, axis: slow},
              {segment: G0, direction: 1}]}
    - {id: sqz1, source: laser, freq_offset_hz: 0.0, jones_in: [1, 0], power_w: 0.0, observer: gbs,
       path: [{segment: PUMP, direction: 1}, {segment: XTAL, direction: 1}, {segment: UP, direction: 1},
              {segment: DMX1, direction: 1}, {segment: EM1, direction: 1}, {segment: D1, direction: 1},
              {segment: F1, direction: 1, axis: slow}, {segment: G1, direction: 1}]}
    # Liu-type probes: enter at PBS_k on the GBS side, cross F_k and D_k backwards on the orthogonal (fast) axis
    - {id: pr0, source: laser, freq_offset_hz: !expr "offline.params.probe_freq_offset_hz", jones_in: [1, 0],
       power_w: !expr "offline.params.p_pr_avg_w", observer: det0,
       path: [{segment: PRsrc, direction: 1}, {segment: PRS0, direction: 1}, {segment: F0, direction: -1, axis: fast},
              {segment: D0, direction: -1}]}
    - {id: pr1, source: laser, freq_offset_hz: !expr "offline.params.probe_freq_offset_hz", jones_in: [1, 0],
       power_w: !expr "offline.params.p_pr_avg_w", observer: det1,
       path: [{segment: PRsrc, direction: 1}, {segment: PRS1, direction: 1}, {segment: F1, direction: -1, axis: fast},
              {segment: D1, direction: -1}]}
    - {id: ref0, source: laser, freq_offset_hz: 0.0, jones_in: [1, 0], power_w: !expr "offline.params.p_ref_w", observer: det0,
       path: [{segment: REF, direction: 1}, {segment: REF0, direction: 1}]}
    - {id: ref1, source: laser, freq_offset_hz: 0.0, jones_in: [1, 0], power_w: !expr "offline.params.p_ref_w", observer: det1,
       path: [{segment: REF, direction: 1}, {segment: REF1, direction: 1}]}
    - {id: lo0, source: laser, freq_offset_hz: 0.0, jones_in: [1, 0], power_w: !expr "offline.params.p_lo_w", observer: gbs,
       path: [{segment: REF, direction: 1}, {segment: LO0, direction: 1}]}
    - {id: lo1, source: laser, freq_offset_hz: 0.0, jones_in: [1, 0], power_w: !expr "offline.params.p_lo_w", observer: gbs,
       path: [{segment: REF, direction: 1}, {segment: EM1, direction: 1}, {segment: LO1, direction: 1}]}
  observers:
    - {id: gbs, kind: gbs_input}       # GBS inputs; BHD_k sits there for characterisation (D46: +2.2 % loss at the BHD)
    - {id: det0, kind: detector}       # probe detectors near the demux ("検出は振り分けの手前", 00_summary §2.2)
    - {id: det1, kind: detector}
  locks:                               # L-Liu (00_summary §2.4): φ_pr,k − φ_ref,k held at the side of the fringe
    - {id: L0, combo: {pr0: 1.0, ref0: -1.0}, setpoint_rad: !pi_frac 0.5, observer: det0}
    - {id: L1, combo: {pr1: 1.0, ref1: -1.0}, setpoint_rad: !pi_frac 0.5, observer: det1}
  ports:
    - {index: 0, squeezed: sqz0, lo: lo0, probe: pr0, gbs_observer: gbs, bhd_observer: gbs}
    - {index: 1, squeezed: sqz1, lo: lo1, probe: pr1, gbs_observer: gbs, bhd_observer: gbs}   # = port k (header)
  coef:
    # free space / patch fibres: strain → k_ε·L (free space 2π/λ0 per unit strain and metre; fibre ξ_eo 2πn/λ0, conv §4)
    - {id: PUMP.strain.all.phase, segment: PUMP, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_fs_rad_per_m * offline.params.L_pump_m"}
    - {id: PUMP.strain.all.group_delay, segment: PUMP, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.L_pump_m / 299792458.0"}
    - {id: XTAL.dT.all.phase, segment: XTAL, driver: dT, beam: "*", effect: phase, value: !expr "offline.params.c_xtal_rad_per_K"}
    - {id: XTAL.dT.all.group_delay, segment: XTAL, driver: dT, beam: "*", effect: group_delay, value: 0.0}
    - {id: UP.strain.all.phase, segment: UP, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_fs_rad_per_m * offline.params.L_up_m"}
    - {id: UP.strain.all.group_delay, segment: UP, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.L_up_m / 299792458.0"}
    - {id: DMX0.eom.all.phase, segment: DMX0, driver: eom, beam: "*", effect: phase, value: 1.0}
    - {id: DMX0.eom.all.group_delay, segment: DMX0, driver: eom, beam: "*", effect: group_delay, value: 0.0}
    - {id: DMX1.eom.all.phase, segment: DMX1, driver: eom, beam: "*", effect: phase, value: 1.0}
    - {id: DMX1.eom.all.group_delay, segment: DMX1, driver: eom, beam: "*", effect: group_delay, value: 0.0}
    - {id: D0.strain.all.phase, segment: D0, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_fs_rad_per_m * offline.params.L_d_m"}
    - {id: D0.strain.all.group_delay, segment: D0, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.L_d_m / 299792458.0"}
    - {id: D1.strain.all.phase, segment: D1, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_fs_rad_per_m * offline.params.L_d_m"}
    - {id: D1.strain.all.group_delay, segment: D1, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.L_d_m / 299792458.0"}
    - {id: G0.strain.all.phase, segment: G0, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_fs_rad_per_m * offline.params.L_g_m"}
    - {id: G0.strain.all.group_delay, segment: G0, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.L_g_m / 299792458.0"}
    - {id: G1.strain.all.phase, segment: G1, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_fs_rad_per_m * offline.params.L_g_m"}
    - {id: G1.strain.all.group_delay, segment: G1, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.L_g_m / 299792458.0"}
    # port fibres (T08 eq. 2.1, 2.4; slow-axis values, segment_phase adds the fast-axis terms, conv §9)
    - {id: F0.dT.all.phase, segment: F0, driver: dT, beam: "*", effect: phase, value: !expr "offline.params.k_T_rad_per_m_K * offline.params.L_0_m"}
    - {id: F0.dT.all.group_delay, segment: F0, driver: dT, beam: "*", effect: group_delay, value: !expr "offline.params.kappa_tau_s_per_m_K * offline.params.L_0_m"}
    - {id: F0.strain.all.phase, segment: F0, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_rad_per_m * offline.params.L_0_m"}
    - {id: F0.strain.all.group_delay, segment: F0, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.n_g * offline.params.L_0_m / 299792458.0"}
    - {id: F0.stretcher.all.phase, segment: F0, driver: stretcher, beam: "*", effect: phase, value: 1.0}
    - {id: F0.stretcher.all.group_delay, segment: F0, driver: stretcher, beam: "*", effect: group_delay, value: 1.05e-15}    # n_g/(n ξ_eo ω0) (T08 §2.3)
    - {id: F0.tec.all.phase, segment: F0, driver: tec, beam: "*", effect: phase, value: !expr "offline.params.k_T_rad_per_m_K * offline.params.L_0_m"}
    - {id: F0.tec.all.group_delay, segment: F0, driver: tec, beam: "*", effect: group_delay, value: !expr "offline.params.kappa_tau_s_per_m_K * offline.params.L_0_m"}
    - {id: F1.dT.all.phase, segment: F1, driver: dT, beam: "*", effect: phase, value: !expr "offline.params.k_T_rad_per_m_K * offline.params.L_k_m"}
    - {id: F1.dT.all.group_delay, segment: F1, driver: dT, beam: "*", effect: group_delay, value: !expr "offline.params.kappa_tau_s_per_m_K * offline.params.L_k_m"}
    - {id: F1.strain.all.phase, segment: F1, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_rad_per_m * offline.params.L_k_m"}
    - {id: F1.strain.all.group_delay, segment: F1, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.n_g * offline.params.L_k_m / 299792458.0"}
    - {id: F1.stretcher.all.phase, segment: F1, driver: stretcher, beam: "*", effect: phase, value: 1.0}
    - {id: F1.stretcher.all.group_delay, segment: F1, driver: stretcher, beam: "*", effect: group_delay, value: 1.05e-15}
    - {id: F1.tec.all.phase, segment: F1, driver: tec, beam: "*", effect: phase, value: !expr "offline.params.k_T_rad_per_m_K * offline.params.L_k_m"}
    - {id: F1.tec.all.group_delay, segment: F1, driver: tec, beam: "*", effect: group_delay, value: !expr "offline.params.kappa_tau_s_per_m_K * offline.params.L_k_m"}
    # distribution fibres (strain only)
    - {id: PRsrc.strain.all.phase, segment: PRsrc, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_rad_per_m * offline.params.L_prsrc_m"}
    - {id: PRsrc.strain.all.group_delay, segment: PRsrc, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.n_g * offline.params.L_prsrc_m / 299792458.0"}
    - {id: PRS0.strain.all.phase, segment: PRS0, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_rad_per_m * offline.params.L_prs_m"}
    - {id: PRS0.strain.all.group_delay, segment: PRS0, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.n_g * offline.params.L_prs_m / 299792458.0"}
    - {id: PRS1.strain.all.phase, segment: PRS1, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_rad_per_m * offline.params.L_prs_m"}
    - {id: PRS1.strain.all.group_delay, segment: PRS1, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.n_g * offline.params.L_prs_m / 299792458.0"}
    - {id: REF.strain.all.phase, segment: REF, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_rad_per_m * offline.params.L_ref_m"}
    - {id: REF.strain.all.group_delay, segment: REF, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.n_g * offline.params.L_ref_m / 299792458.0"}
    - {id: REF0.strain.all.phase, segment: REF0, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_rad_per_m * offline.params.L_refk_m"}
    - {id: REF0.strain.all.group_delay, segment: REF0, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.n_g * offline.params.L_refk_m / 299792458.0"}
    - {id: REF1.strain.all.phase, segment: REF1, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_rad_per_m * offline.params.L_refk_m"}
    - {id: REF1.strain.all.group_delay, segment: REF1, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.n_g * offline.params.L_refk_m / 299792458.0"}
    - {id: LO0.dT.all.phase, segment: LO0, driver: dT, beam: "*", effect: phase, value: !expr "offline.params.k_T_rad_per_m_K * offline.params.L_lo0_m"}
    - {id: LO0.dT.all.group_delay, segment: LO0, driver: dT, beam: "*", effect: group_delay, value: !expr "offline.params.kappa_tau_s_per_m_K * offline.params.L_lo0_m"}
    - {id: LO0.strain.all.phase, segment: LO0, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_rad_per_m * offline.params.L_lo0_m"}
    - {id: LO0.strain.all.group_delay, segment: LO0, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.n_g * offline.params.L_lo0_m / 299792458.0"}
    - {id: LO1.dT.all.phase, segment: LO1, driver: dT, beam: "*", effect: phase, value: !expr "offline.params.k_T_rad_per_m_K * offline.params.L_lo1_m"}
    - {id: LO1.dT.all.group_delay, segment: LO1, driver: dT, beam: "*", effect: group_delay, value: !expr "offline.params.kappa_tau_s_per_m_K * offline.params.L_lo1_m"}
    - {id: LO1.strain.all.phase, segment: LO1, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_rad_per_m * offline.params.L_lo1_m"}
    - {id: LO1.strain.all.group_delay, segment: LO1, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.n_g * offline.params.L_lo1_m / 299792458.0"}

offline:
  params:
    # --- design: set by each base preset (D07, D39, D43, D50; 00_summary §2.2) ------------------------------------
    # f_rep_hz, N_b, n_guard, L_xtal_m, n_g_xtal, n_sub_fiber, tau_mode_s, f_max_metric_hz, demux values (dmx_*)
    lambda0_m: 1.54532e-6                 # D07: Ref A value until the future wavelength is fixed (PROCESS_LOG)
    K_ports: 32                           # D08
    port_k: !choice [1, 15, 31]           # port number represented by topology port 1 (D13: L_k swept)
    L0_m: !sweep [1.0, 5.0, 3]            # common fibre length of port 0 (T11 §3.1, 00_summary §7.2 "0–数 m")
    n_g: 1.468                            # PM15-U25D group index: SMF stand-in (D49, T06) UNVERIFIED
    # port delay L_k = L_0 + k·(N_b + n_guard)·c·T_rep/n_g (D39, D62-3)
    L_0_m: !expr "L0_m"
    L_k_m: !expr "L0_m + port_k * (N_b + n_guard) * 299792458.0 / (f_rep_hz * n_g)"
    tau_k_s: !expr "n_g * L_k_m / 299792458.0"
    tau_0_s: !expr "n_g * L_0_m / 299792458.0"
    t_frame_s: !expr "K_ports * (N_b + n_guard) / f_rep_hz"   # GBS frame (D46: GBS every frame)
    # free-space / patch lengths (not designed yet) [AE]
    L_pump_m: 1.0
    L_up_m: 1.0
    L_d_m: 0.5
    L_g_m: 0.5
    L_prsrc_m: 5.0                        # probe source → split (AOM, isolator) [AE]
    L_prs_m: 2.0                          # split → PBS_k [AE]
    L_refk_m: 1.0                         # reference branch → det_k [AE]
    L_ref_m: !sweep [1.0, 21.0, 3]        # common reference delivery; sets the delay matching T_a − T_b (T10 §3.8, D51-5:
                                          # 0–100 ns, 00_summary §7.2); 1 m ≈ T_a − T_b of the probe/reference arms [AE]
    # LO_k delivered from the reference point and delay-matched to the squeezed path (D09), residual δτ_k (D51-6)
    dtau_lo_s: !sweep [0.0, 1.0e-12, 3]   # 0–1 ps (00_summary §7.2 Fw); OPO presets tolerate 0–500 ps (T17)
    L_lo_fs_equiv_m: !expr "(1.0003 * (L_pump_m + L_up_m + L_d_m + L_g_m) + n_g_xtal * L_xtal_m) / n_g"
    L_lo0_m: !expr "L_0_m + L_lo_fs_equiv_m - L_ref_m"
    L_lo1_m: !expr "L_k_m + L_lo_fs_equiv_m - L_ref_m + 299792458.0 * dtau_lo_s / n_g"
    # --- fibre coefficients ---------------------------------------------------------------------------------------
    k_T_rad_per_m_K: !sweep [40.0, 48.0, 3]      # thermal phase coefficient, T08 §2.2 (nominal 44)
    kappa_tau_s_per_m_K: 3.9e-14          # 39 ps/(km·K), T08 §2.3 (Slavík 2015)
    k_eps_rad_per_m: !expr "0.78 * 2 * pi * 1.468 / lambda0_m"    # ξ_eo·2πn/λ0 (conv §4, T16 ξ_eo 0.78)
    k_eps_fs_rad_per_m: !expr "2 * pi / lambda0_m"               # free space: 2π/λ0 per unit strain and metre
    K_T_pm_rad_per_m_K: !sweep [-3.4, -0.3, 3]   # PM axis-difference coefficient, negative (conv §9, D51-2, D53: 0.3–3.4)
    alpha_pm_db_per_km: 0.5               # Corning PANDA PM max 0.5 dB/km (T12 §3.2)
    n_sub_F0: 2
    D_pol_rad2_per_s: !sweep_log [1.0e-8, 1.0e-2, 4]   # SMF polarization diffusion, used by presets/axes/fiber/smf.yaml
                                          # (00_summary §7.3, T09 §3; PM and SMF are equal candidates, D32)
    # --- environment (D27: parametric models swept; T08) ----------------------------------------------------------
    r_T_spool_k_per_s: !sweep_log [1.0e-6, 1.0e-3, 3]   # ambient drift of the port spools (T08 §2.4; 00_summary §7.3)
    dr_T_k_per_s: !sweep [0.0, 1.0e-5, 3]  # spool k minus spool 0 drift [AE] (separate spools)
    tau_th_spool_s: !sweep_log [1.0, 3000.0, 3]   # ambient → fibre lag (T08 §2.4; nominal 300 s)
    h_ref_spool_rad2_hz: !sweep_log [1.0e-3, 0.4, 3]   # f⁻² mechanical noise at L_ref = 1 km, spooled (T08 §2.5, §6.2: 0.04)
    mech_gamma: !choice [1.0, 2.0]        # length exponent (T08 §2.5)
    mech_f_c_hz: !sweep_log [100.0, 1.0e+4, 3]   # f⁻² corner (T08 §2.5, nominal 1 kHz)
    spatial_coherence: !sweep [0.0, 1.0, 3]   # κ of the port fibres: 0 distributed, 1 lumped (T08 §2.7, conv §9)
    rho_ports: !sweep [0.0, 0.99, 3]      # correlation of the port fibres (one spool / bundle?, T08 §2.8, D13; 00_summary §7.2)
    f_rho_hz: !sweep_log [1.0, 1.0e+3, 3]   # correlation corner (T08 §2.8 shape, D57-5) [AE]
    h_ref_dist_rad2_hz: !sweep_log [1.0e-3, 0.4, 3]   # distribution patch fibres at L_ref = 1 km (spool level, T08 §2.5) [AE]
    h_ref_fs_rad2_hz: !sweep_log [1.0e-8, 1.0e-4, 3]   # free-space optics at L_ref = 1 m [AE] UNVERIFIED (no source)
    # --- laser (D07: not specified; same laser for squeezer, probe, reference, LO; D40) ----------------------------
    h0_hz2_per_hz: !sweep_log [1.0, 8.0e+3, 3]   # white FM (Δν = π h0): 1 → 3 Hz, 64 ≈ Ref A Koheras stand-in 0.2 kHz
                                          # (UNVERIFIED, D63-6), 8e3 = DX1 SC lower end (D51-9); metric (ii) (3) gives the
                                          # linewidth requirement (D31-3, D47)
    # --- squeezer crystal (D42 option (a): crystal temperature stabilised to ≈ 1 mK) --------------------------------
    c_xtal_rad_per_K: 3.0                 # θ_sq per K: ½ × the pump phase ≈ 6 mrad/mK (T01, 00_summary N03) [AE ½ factor]
    r_T_xtal_k_per_s: !sweep_log [1.0e-7, 1.0e-5, 3]   # residual crystal drift under a ≈ 1 mK stabilisation [AE]
    # --- demux switch drive (T11 §3.5; values of T11 test 5; preset-specific stage count / loss / ER in dmx_*) ----
    dmx_kappa_pm: 1.0                     # T11 test 5
    dmx_v_pi_v: 1000.0                    # Pockels-cell half-wave voltage [AE] UNVERIFIED
    dmx_drive_noise_v_rms: !sweep_log [0.14, 14.0, 3]   # δV/V_π = 1.4e−3 (T11 test 5) ×0.1–10 [AE]
    dmx_bias_rw_rad_per_rts: 1.0e-4       # bias random walk [AE] UNVERIFIED (T11 §3.5 Salvestrini 2011 shape only)
    # --- Liu-type probe (D40; T14 §8.2 placeholders) ------------------------------------------------------------------
    p_pr_avg_w: !sweep_log [1.0e-10, 1.0e-3, 4]   # P̄ at the detector, 0.1 nW–1 mW (D40, 00_summary §7.2)
    probe_duty: !sweep_log [1.0e-3, 1.0, 4]       # AOM gate duty (D40)
    probe_t_offset_s: 5.0e-9              # probe start relative to the squeezed slot [AE] (T10 test 7)
    eps_aom: 1.0e-5                       # AOM off-state leak (−50 dB) [AE] UNVERIFIED
    probe_freq_offset_hz: 0.0             # same frequency (D40; overlays: 80 MHz, 7 GHz, 1 THz)
    p_ref_w: 1.0e-3                       # reference power at det_k (T14 §8.2)
    liu_responsivity_a_per_w: 1.0         # T14 §2.5 placeholder (η ℜ)
    liu_gain_v_per_a: 1.0e+3              # [AE] keeps K = 2ℜG√(P̄/D·P_ref) inside the ±0.5 V ADC at the nominal point
    liu_i_n_a_rthz: 1.0e-11               # T14 §2.5 placeholder (10 pA/√Hz)
    liu_visibility: 1.0                   # T14 §8.2 placeholder (V = 1)
    liu_k_v: !expr "2 * liu_responsivity_a_per_w * liu_gain_v_per_a * sqrt(p_pr_avg_w / probe_duty * p_ref_w) * liu_visibility"
                                          # fringe amplitude K with gated detection (T14 §8.2): slope −K at X = π/2
    # --- controller (fpga_generic; T16 §4.5; overlays controller/*) ---------------------------------------------------
    latency_s: !choice [1.0e-6, 2.0e-6]   # τ_L (fpga_generic 0.1–2 µs, T16 §4.5); ≥ 1/f_sim (D55-1)
    dac_bits: !choice [14, 16]            # fpga_generic 12–16 bit (00_summary §7.2)
    out_range_v: 0.5                      # ±0.5 V (fpga_generic, Moku:Delta PID stand-in, T16 §4.5)
    f_u_hz: !sweep_log [1.0e+3, 3.0e+4, 3]   # fine (PZT) loop unity-gain frequency [AE] (T14 §8.2 "10 kHz")
    f_12_hz: !sweep_log [3.0e-3, 0.3, 3]  # PZT → TEC crossover (T16 §4.4 offload) [AE]; ≪ 1/(2π τ_th)
    tec_rate_div: 10000                   # slow stage at 100 Hz (G10: thermal 10–100 Hz)
    # --- actuators (D41) ----------------------------------------------------------------------------------------------
    pzt_range_rad: !sweep_log [5.0, 200.0, 3]   # stretcher half range at ±out_range_v (915B-like 32.5 rad, T16 §7.2) UNVERIFIED
    pzt_f_res_hz: !sweep [5.0e+3, 6.0e+4, 3]    # stretcher resonance (915B 5–60 kHz, D51-11) UNVERIFIED
    pzt_q: !sweep_log [3.0, 100.0, 3]           # D51-11
    pzt_k_rad_per_v: !expr "pzt_range_rad / out_range_v"
    tec_k_t_k_per_v: 4.0                  # TEC gain at ±0.5 V → ±2 K [AE] (T16 §3.4)
    tec_tau_th_s: !sweep_log [1.0, 100.0, 3]    # T16 §3.4, 00_summary §7.2 (1–100 s)
    tec_dt_max_k: !sweep [1.0, 10.0, 3]   # ±1–10 K (00_summary §7.2)
    tec_k_rad_per_v_k: !expr "tec_k_t_k_per_v * k_T_rad_per_m_K * L_k_m"   # DC phase per volt of the port-k TEC
    tec_k_rad_per_v_0: !expr "tec_k_t_k_per_v * k_T_rad_per_m_K * L_0_m"
    # --- LO / BHD (D45; preset-specific variants in each base preset) -------------------------------------------------
    p_lo_w: 1.0e-3                        # LO power at the BHD [AE]
    qe_bhd: !sweep [0.97, 0.99, 3]        # 00_summary §7.2 (T13)
    clearance_bhd_db: !sweep [10.0, 30.0, 3]   # 00_summary §7.2 (T13)
    eta_lo_mm: 0.99                       # LO spatial mode matching at the BHD (T12 §4.2 "LO の整合 0.99")
    # --- path build (D38, T12 §4.2; overlays path_build/NF|MF|LL) -----------------------------------------------------
    eta_up: 0.951                         # waveguide 0.98 × optics 0.99 × free space → fibre 0.98 (T12 §4.2)
    n_conn: 6                             # connections per port (T12 §4.2 [AE])
    il_conn_db: 0.06                      # LL: fusion splices 0.06 dB (Fujikura FSM-100P, T12 §3.2)
    n_inj: 2                              # Liu probe extraction + injection elements (T12 §4.2)
    il_inj_db: 0.044                      # LL: free-space PBS 1 % (T12 §3.2 [AE])
    il_str_db: 0.05                       # stretcher bend loss (T12 §3.3 [AE] UNVERIFIED)
    il_sq_mod_db: 0.0                     # no modulator on the squeezed path (D10; bad_eom_on_squeezed: 3.2 dB)
    eta_bhd_dilution: 1.0                 # pulse-resolved / gated BHD; integrating: 1/K (bhd/integrating, T11 §3.7)
    eta_conn: !expr "10 ** (-n_conn * il_conn_db / 10)"
    eta_inj: !expr "10 ** (-n_inj * il_inj_db / 10)"
    eta_str: !expr "10 ** (-il_str_db / 10)"
    # --- stray light and SBS (T10 §3.4, T07 §5; B10) -------------------------------------------------------------------
    b_r_per_m: 6.18e-8                    # Rayleigh backscatter coefficient (T10 §3.4.5, 00_summary C13)
    eps_xt_pm: 1.0e-3                     # PM crosstalk −30 dB @ 100 m (Corning PANDA, T12 §3.2) [used for orthogonal probe]
    t_perp_pbs: 1.0e-3                    # PBS leakage of the orthogonal probe (−30 dB) [AE]
    probe_linewidth_hz: 1.0e+3            # [AE]
    t_gate_s: !expr "tau_mode_s"          # GBS detection gate = mode length (D46/D50 condition)
    gbs_filter_fwhm_hz: !expr "1.0 / tau_mode_s"   # flat GBS-side filter of the mode bandwidth [AE]
    sbs_gain_warn: 5.0                    # T07 §5.1
    p_lo_sbs_w: !expr "p_lo_w * min(1.0, f_rep_hz * tau_mode_s)"   # LO power per comb line (pulsed LO: P̄·f_rep·τ_mode,
                                          # one line per Brillouin linewidth when f_rep > Δν_B) [AE]; CW LO overlay: P̄

  blocks:
    - block: loss_budget               # path build (T12 §4.2 model η_k = η_up·η_dmx·10^{−[N_j IL_j + N_inj IL_inj + IL_str]/10})
      name: optics
      params:
        elements:
          - {id: upstream, eta: !expr "offline.params.eta_up", kind: component, applies_to: [gbs, bhd], segment: UP, observer: null,
             source: "T12 §4.2 η_up = 0.98 × 0.99 × 0.98"}
          - {id: conn0, eta: !expr "offline.params.eta_conn", kind: component, applies_to: [gbs, bhd], segment: D0, observer: null,
             source: "T12 §4.2 N_j connections × IL_j (D38 path build)"}
          - {id: conn1, eta: !expr "offline.params.eta_conn", kind: component, applies_to: [gbs, bhd], segment: D1, observer: null,
             source: "T12 §4.2 N_j connections × IL_j (D38 path build)"}
          - {id: inj0, eta: !expr "offline.params.eta_inj", kind: component, applies_to: [gbs, bhd], segment: G0, observer: null,
             source: "T12 §4.2 Liu probe extraction / injection N_inj × IL_inj"}
          - {id: inj1, eta: !expr "offline.params.eta_inj", kind: component, applies_to: [gbs, bhd], segment: G1, observer: null,
             source: "T12 §4.2 Liu probe extraction / injection N_inj × IL_inj"}
          - {id: str0, eta: !expr "offline.params.eta_str", kind: component, applies_to: [gbs, bhd], segment: F0, observer: null,
             source: "T12 §3.3 stretcher bend loss [AE]"}
          - {id: str1, eta: !expr "offline.params.eta_str", kind: component, applies_to: [gbs, bhd], segment: F1, observer: null,
             source: "T12 §3.3 stretcher bend loss [AE]"}
          - {id: lo_mm, eta: !expr "offline.params.eta_lo_mm", kind: mode_overlap_spatial, applies_to: [bhd], segment: null, observer: gbs,
             source: "T12 §4.2 LO spatial mode matching 0.99"}
          - {id: bhd_dilution, eta: !expr "offline.params.eta_bhd_dilution", kind: detector, applies_to: [bhd], segment: null,
             observer: gbs, source: "T11 §3.7 integrating BHD (1 squeezed slot in K); 1 for pulse-resolved / gated BHD"}
          - {id: sqmod0, eta: !expr "10 ** (-offline.params.il_sq_mod_db / 10)", kind: component, applies_to: [gbs, bhd], segment: G0,
             observer: null, source: "modulator on the squeezed path (D10: none in the reference presets; bad_eom_on_squeezed)"}
          - {id: sqmod1, eta: !expr "10 ** (-offline.params.il_sq_mod_db / 10)", kind: component, applies_to: [gbs, bhd], segment: G1,
             observer: null, source: "modulator on the squeezed path (D10: none in the reference presets; bad_eom_on_squeezed)"}
        toggles: {enabled: true}
    - block: detector_efficiency       # BHD_k at the GBS input (D46: GBS and BHD η reported separately)
      name: bhd_det
      params:
        device: null
        observer: gbs
        applies_to: [bhd]
        source: "00_summary §7.2 BHD QE 0.97–0.99, clearance 10–30 dB (T13)"
        f_s_hz: 1.0e+6
        p_lo_w: !expr "offline.params.p_lo_w"
        qe: !expr "offline.params.qe_bhd"
        clearance_lin: !expr "10 ** (offline.params.clearance_bhd_db / 10)"
        p_lo_ref_w: !expr "offline.params.p_lo_w"
        toggles: {qe: true, circuit_noise: true, imbalance_leak: false, freq_response: false, dip: false, subtract_dark: false}
    - block: demux_design              # D39 / T11: port delays, switch losses (registered on DMX0 / DMX1), feasibility CHK
      name: dmx
      params:
        K: !expr "offline.params.K_ports"
        layout: !expr "offline.params.dmx_layout"
        switching: !expr "offline.params.dmx_switching"
        f_rep_hz: !expr "offline.params.f_rep_hz"
        N_b: !expr "offline.params.N_b"
        n_guard: !expr "offline.params.n_guard"
        L0_m: !expr "offline.params.L0_m"
        n_g: !expr "offline.params.n_g"
        alpha_db_per_m: !expr "offline.params.alpha_pm_db_per_km / 1000"
        t_stage: !expr "offline.params.dmx_t_stage"
        stage_gdd_s2: 0.0
        segments: null
        port_segments: {DMX0: 0, DMX1: !expr "offline.params.port_k"}   # WP-I5 addition: only the represented ports
        loss_applies_to: [gbs, bhd]
        loss_source: "T11 §3.2–§3.3 (stage transmission, ER), D39"
        er_db: !expr "offline.params.dmx_er_db"
        t_rise_s: !expr "offline.params.dmx_t_rise_s"
        sigma_j_s: !expr "offline.params.dmx_sigma_j_s"
        t_ring_s: 0.0
        tau_mode_s: !expr "offline.params.tau_mode_s"
        f_tog_max_hz: !expr "offline.params.dmx_f_tog_max_hz"
        toggles: {enabled: true, insertion_loss: true, crosstalk: true, rise_time_clipping: false}
    - block: stray_light_table         # probe → squeezed direction, port k fibre (T10 eq. (9); B10, D46, D59-7)
      name: stray1
      params:
        p_peak_w: [1.0e-9, 1.0e-6, 1.0e-3, 1.0e-1]
        duty: !expr "offline.params.probe_duty"
        probe: {freq_offset_hz: !expr "offline.params.probe_freq_offset_hz", linewidth_hz: !expr "offline.params.probe_linewidth_hz",
                polarization: pm_orthogonal, eps_xt: !expr "offline.params.eps_xt_pm", t_perp: !expr "offline.params.t_perp_pbs"}
        brillouin: {g_b_m_per_w: 5.0e-11, a_eff_m2: 8.0e-11, nu_b_hz: 1.08e+10, dnu_b_hz: 3.0e+7}   # T07 §5 values
        rayleigh: {b_r_per_m: !expr "offline.params.b_r_per_m"}
        L_m: !expr "offline.params.L_k_m"
        alpha_per_m: !expr "offline.params.alpha_pm_db_per_km / 1000 * log(10) / 10"
        gamma_per_w_m: 1.3e-3          # T06 SMF stand-in
        f_R: 0.18                      # T06
        raman_model: blow_wood         # D49
        lambda0_m: !expr "offline.params.lambda0_m"
        temperature_k: 295.0           # D27
        t_gate_s: !expr "offline.params.t_gate_s"
        reflections: []
        gbs_filter: {shape: flat, fwhm_hz: !expr "offline.params.gbs_filter_fwhm_hz"}
        wdm_isolation_lin: 1.0
        mode: {shape: gaussian, t_fwhm_s: !expr "offline.params.tau_mode_s"}
        toggles: {stray_rayleigh: true, stray_brillouin: true, stray_raman: true, stray_reflections: true}
    - block: sbs_check                 # CHK: probe peak power in the port-k fibre (T07 §5.1)
      name: sbs_probe
      params:
        brillouin: {g_b_m_per_w: 5.0e-11, a_eff_m2: 8.0e-11, nu_b_hz: 1.08e+10, dnu_b_hz: 3.0e+7}
        alpha_per_m: !expr "offline.params.alpha_pm_db_per_km / 1000 * log(10) / 10"
        L_m: !expr "offline.params.L_k_m"
        power_w: !expr "offline.params.p_pr_avg_w / offline.params.probe_duty"
        laser_linewidth_hz: !expr "offline.params.probe_linewidth_hz"
        gain_warn: !expr "offline.params.sbs_gain_warn"
    - block: sbs_check                 # CHK: LO delivery fibre of port k (CW / pulsed LO power per Brillouin linewidth)
      name: sbs_lo
      params:
        brillouin: {g_b_m_per_w: 5.0e-11, a_eff_m2: 8.0e-11, nu_b_hz: 1.08e+10, dnu_b_hz: 3.0e+7}
        alpha_per_m: !expr "offline.params.alpha_pm_db_per_km / 1000 * log(10) / 10"
        L_m: !expr "offline.params.L_lo1_m"
        power_w: !expr "offline.params.p_lo_sbs_w"
        laser_linewidth_hz: !expr "offline.params.probe_linewidth_hz"
        gain_warn: !expr "offline.params.sbs_gain_warn"

pipeline:
  # ---- laser and environment ----------------------------------------------------------------------------------------
  - block: laser_source
    name: laser
    params:
      source: laser
      power_w: 1.0e-3                  # not used by the phase model
      h0_hz2_per_hz: !expr "offline.params.h0_hz2_per_hz"
      oob_pairs:
        - {target: EM1, tau_s: !expr "offline.params.tau_k_s - offline.params.tau_0_s"}   # D31-3 above f_N (header)
      rin_targets: []
      toggles: {fm_white: true, fm_flicker: false, peaks: false, drift: false, dither: false, sbs: false, rin: false}
  - block: segment_thermal              # spool of port 0 (T08 §2.4)
    name: env.thermal.F0
    params:
      segments: [F0]
      tau_th_s: {F0: !expr "offline.params.tau_th_spool_s"}
      r_T_k_per_s: !expr "offline.params.r_T_spool_k_per_s - 0.5 * offline.params.dr_T_k_per_s"
      toggles: {drift: true, random: false, periodic: false}
  - block: segment_thermal              # spool of port k
    name: env.thermal.F1
    params:
      segments: [F1]
      tau_th_s: {F1: !expr "offline.params.tau_th_spool_s"}
      r_T_k_per_s: !expr "offline.params.r_T_spool_k_per_s + 0.5 * offline.params.dr_T_k_per_s"
      toggles: {drift: true, random: false, periodic: false}
  - block: segment_thermal              # LO delivery spool (affects metric (i) only)
    name: env.thermal.LO
    params:
      segments: [LO0, LO1]
      tau_th_s: {LO0: !expr "offline.params.tau_th_spool_s", LO1: !expr "offline.params.tau_th_spool_s"}
      r_T_k_per_s: !expr "offline.params.r_T_spool_k_per_s"
      toggles: {drift: true, random: false, periodic: false}
  - block: segment_mech_noise           # port fibres (T08 eq. 2.7, 2.12): distributed / mixed, correlated by ρ (D13 pair axis)
    name: env.mech.ports
    params:
      segments: [F0, F1]
      L_ref_m: 1000.0
      gamma: !expr "offline.params.mech_gamma"
      k_eps_rad_per_m: !expr "offline.params.k_eps_rad_per_m"
      h_ref_rad2_hz: !expr "offline.params.h_ref_spool_rad2_hz"
      f_c_hz: !expr "offline.params.mech_f_c_hz"
      f_lo_hz: 0.1
      rho_0: !expr "offline.params.rho_ports"
      f_rho_hz: !expr "offline.params.f_rho_hz"
      spatial_coherence: {F0: !expr "offline.params.spatial_coherence", F1: !expr "offline.params.spatial_coherence"}
      toggles: {mech: true, peaks: false, correlation: true}
  - block: segment_mech_noise           # LO delivery fibres (metric (i) only)
    name: env.mech.lo
    params:
      segments: [LO0, LO1]
      L_ref_m: 1000.0
      gamma: !expr "offline.params.mech_gamma"
      k_eps_rad_per_m: !expr "offline.params.k_eps_rad_per_m"
      h_ref_rad2_hz: !expr "offline.params.h_ref_spool_rad2_hz"
      f_c_hz: !expr "offline.params.mech_f_c_hz"
      f_lo_hz: 0.1
      rho_0: 0.0
      f_rho_hz: !expr "offline.params.f_rho_hz"
      toggles: {mech: true, peaks: false, correlation: false}
  - block: segment_mech_noise           # probe / reference distribution: the common points (D31-2, metric (ii) component 2)
    name: env.mech.dist
    params:
      segments: [PRsrc, PRS0, PRS1, REF, REF0, REF1]
      L_ref_m: 1000.0
      gamma: !expr "offline.params.mech_gamma"
      k_eps_rad_per_m: !expr "offline.params.k_eps_rad_per_m"
      h_ref_rad2_hz: !expr "offline.params.h_ref_dist_rad2_hz"
      f_c_hz: !expr "offline.params.mech_f_c_hz"
      f_lo_hz: 0.1
      rho_0: 0.0
      f_rho_hz: !expr "offline.params.f_rho_hz"
      toggles: {mech: true, peaks: false, correlation: false}
  - block: segment_mech_noise           # free-space optics inside the locked path (demux → extraction)
    name: env.mech.fs_lock
    params:
      segments: [D0, D1]
      L_ref_m: 1.0
      gamma: 1.0
      k_eps_rad_per_m: !expr "offline.params.k_eps_fs_rad_per_m"
      h_ref_rad2_hz: !expr "offline.params.h_ref_fs_rad2_hz"
      f_c_hz: !expr "offline.params.mech_f_c_hz"
      f_lo_hz: 0.1
      rho_0: 0.0
      f_rho_hz: !expr "offline.params.f_rho_hz"
      toggles: {mech: true, peaks: false, correlation: false}
  - block: segment_mech_noise           # squeezed-only free space (metric (ii) component 4): pump path, upstream, PBS_k → GBS
    name: env.mech.fs_sq
    params:
      segments: [PUMP, UP, G0, G1]
      L_ref_m: 1.0
      gamma: 1.0
      k_eps_rad_per_m: !expr "offline.params.k_eps_fs_rad_per_m"
      h_ref_rad2_hz: !expr "offline.params.h_ref_fs_rad2_hz"
      f_c_hz: !expr "offline.params.mech_f_c_hz"
      f_lo_hz: 0.1
      rho_0: 0.0
      f_rho_hz: !expr "offline.params.f_rho_hz"
      toggles: {mech: true, peaks: false, correlation: false}
  - block: demux_switch                 # port 0 demux stages (T11 §3.5): drive noise sampled once per frame → white
    name: dmx0
    params:
      segment: DMX0
      driver: eom
      n_sub: 1
      sub: [0, 1]
      ring_len: 0
      n_stages: !expr "offline.params.dmx_n_stages"
      drive_noise_mode: timeseries     # white per f_sim step (the per-frame white jitter keeps its variance, spread to f_N)
      kappa_pm: !expr "offline.params.dmx_kappa_pm"
      v_pi_v: !expr "offline.params.dmx_v_pi_v"
      drive_noise_v_rms: !expr "offline.params.dmx_drive_noise_v_rms"
      bias_offset_rad: 0.0
      bias_rw_rad_per_rts: !expr "offline.params.dmx_bias_rw_rad_per_rts"
      toggles: {enabled: true, drive_phase_noise: true, bias_drift: true}
  - block: demux_switch                 # port k demux stages
    name: dmx1
    params:
      segment: DMX1
      driver: eom
      n_sub: 1
      sub: [0, 1]
      ring_len: 0
      n_stages: !expr "offline.params.dmx_n_stages"
      drive_noise_mode: timeseries
      kappa_pm: !expr "offline.params.dmx_kappa_pm"
      v_pi_v: !expr "offline.params.dmx_v_pi_v"
      drive_noise_v_rms: !expr "offline.params.dmx_drive_noise_v_rms"
      bias_offset_rad: 0.0
      bias_rw_rad_per_rts: !expr "offline.params.dmx_bias_rw_rad_per_rts"
      toggles: {enabled: true, drive_phase_noise: true, bias_drift: true}
  - block: delay_line_k                 # port 0 delay fibre: timing error, fibre attenuation on F0 (T11 §3.6, D51-6)
    name: delay0
    params:
      port: 0
      f_rep_hz: !expr "offline.params.f_rep_hz"
      N_b: !expr "offline.params.N_b"
      n_guard: !expr "offline.params.n_guard"
      L0_m: !expr "offline.params.L0_m"
      n_g: !expr "offline.params.n_g"
      kappa_t_s_per_m_k: !expr "offline.params.kappa_tau_s_per_m_K"
      dL_m: 0.0
      beta2_s2_per_m: -2.17e-26
      alpha_db_per_m: !expr "offline.params.alpha_pm_db_per_km / 1000"
      in_dT: drv.F0.dT
      segment: F0
      loss_applies_to: [gbs, bhd]
      loss_source: "T12 §3.2 PANDA PM 0.5 dB/km"
      dtau_s: 0.0
      rep_rel_drift: 0.0
      toggles: {static_mismatch: true, delay_thermal: true, rep_rate_drift: false, fiber_loss: true}
  - block: delay_line_k                 # port k delay fibre
    name: delay1
    params:
      port: !expr "offline.params.port_k"
      f_rep_hz: !expr "offline.params.f_rep_hz"
      N_b: !expr "offline.params.N_b"
      n_guard: !expr "offline.params.n_guard"
      L0_m: !expr "offline.params.L0_m"
      n_g: !expr "offline.params.n_g"
      kappa_t_s_per_m_k: !expr "offline.params.kappa_tau_s_per_m_K"
      dL_m: 0.0
      beta2_s2_per_m: -2.17e-26
      alpha_db_per_m: !expr "offline.params.alpha_pm_db_per_km / 1000"
      in_dT: drv.F1.dT
      segment: F1
      loss_applies_to: [gbs, bhd]
      loss_source: "T12 §3.2 PANDA PM 0.5 dB/km"
      dtau_s: 0.0
      rep_rel_drift: 0.0
      toggles: {static_mismatch: true, delay_thermal: true, rep_rate_drift: false, fiber_loss: true}
  # ---- squeezer-side time-loop blocks (OPO length lock, pump locks): filled by the base presets / lock overlays ----------
  - name: squeezer                      # hook: base presets / lock overlays append OPO-length and pump locks here
    seq:
      - block: segment_thermal          # squeezer crystal under its ≈ 1 mK stabilisation (D42 crystal option (a))
        name: env.thermal.xtal
        params:
          segments: [XTAL]
          tau_th_s: {XTAL: 0.0}
          r_T_k_per_s: !expr "offline.params.r_T_xtal_k_per_s"
          toggles: {drift: true, random: false, periodic: false}
  # ---- path model (F6) ---------------------------------------------------------------------------------------------
  - block: segment_phase
    name: path.phase
    params:
      segments: all
      toggles: {phase: true, group_delay: true, pm_axis_drift: true}
  - block: beam_assembler
    name: path.beams
    params:
      beams: all
      sources: {laser: laser.laser.phi}
      toggles: {emission_time: true, polarization: false}
  - block: lock_error                   # true X − π/2 (diagnostics)
    name: path.lock
    params: {locks: all}
  - block: probe_pulser                 # AOM gating of the probe (stray-light timing inputs, D40, D59-7)
    name: pp
    params:
      period_s: !expr "offline.params.t_frame_s"
      p_avg_w: !expr "offline.params.p_pr_avg_w"
      duty: !expr "offline.params.probe_duty"
      t_offset_s: !expr "offline.params.probe_t_offset_s"
      eps_aom: !expr "offline.params.eps_aom"
      toggles: {gating: true, aom_leak: true}
  # ---- L-Liu, port 0 (T14 §8; error signal #6, DC homodyne with the common reference) ----------------------------------
  - block: liu_probe_interferometer
    name: liu0
    params:
      mode: homodyne_dc
      in_pr: beam.pr0.phi
      in_ref: beam.ref0.phi
      out: v.liu0
      p_pr_avg_w: !expr "offline.params.p_pr_avg_w"
      p_ref_w: !expr "offline.params.p_ref_w"
      duty: !expr "offline.params.probe_duty"
      visibility: !expr "offline.params.liu_visibility"
      coupler_sign: 1.0
      v_off_v: 0.0
      responsivity_a_per_w: !expr "offline.params.liu_responsivity_a_per_w"
      gain_v_per_a: !expr "offline.params.liu_gain_v_per_a"
      i_n_a_rthz: !expr "offline.params.liu_i_n_a_rthz"
      toggles: {shot_noise: true, electronic_noise: true, gating: true}
  - block: adc
    name: adc0
    params:
      in: v.liu0
      out: v.adc0
      device: fpga_generic
      noise_vrms: 0.0
      avg_samples: 1
      toggles: {quantization: true, noise: false, saturation: true}   # D49: quantisation on
  - stack:
      stages:
        - seq:
            - block: pid                 # fine stage → stretcher (dv/du = −K·K_pzt < 0: K_i > 0)
              name: pid0f
              params:
                in: v.adc0
                out: ctrl.pid0f.u
                device: fpga_generic
                anti_windup: clamp
                kp: 0.0
                ki_per_s: !expr "2 * pi * offline.params.f_u_hz / (offline.params.liu_k_v * offline.params.pzt_k_rad_per_v)"
                kd_s: 0.0
                omega_is_rad_per_s: 0.0
                omega_ds_rad_per_s: 0.0
                ki2_per_s2: 0.0
                setpoint_v: 0.0
                offset_v: 0.0
                u_min_v: !expr "-offline.params.out_range_v"
                u_max_v: !expr "offline.params.out_range_v"
                toggles: {feedback: true, p_term: false, i_term: true, d_term: false}
            - block: lock_supervisor     # lock-loss detection; 2π reset (fringe_hop) via largerange/fringe_hop.yaml (D41)
              name: sup0
              params:
                u_in: ctrl.pid0f.u
                e_in: v.adc0
                true_in: lock.L0.err
                out: ctrl.sup0.u
                relock: fringe_hop
                u_min_v: !expr "-offline.params.out_range_v * (1 - 2.0 ** (1 - offline.params.dac_bits))"
                u_max_v: !expr "offline.params.out_range_v * (1 - 2.0 ** (1 - offline.params.dac_bits))"
                t_sat_s: 0.0
                e_th: 1.0e+9
                t_e_s: 0.0
                t_hop_s: 1.0e-3
                u_2pi_v: !expr "2 * pi / offline.params.pzt_k_rad_per_v"
                toggles: {relock: false}
          name: stage0f
        - block: pid                     # slow stage → TEC (offload, positive gain, T16 §4.4)
          name: pid0s
          rate_div: !expr "offline.params.tec_rate_div"
          params:
            in: ctrl.sup0.u
            out: ctrl.pid0s.u
            device: fpga_generic
            anti_windup: clamp
            kp: 0.0
            ki_per_s: !expr "2 * pi * offline.params.f_12_hz * offline.params.pzt_k_rad_per_v / offline.params.tec_k_rad_per_v_0"
            kd_s: 0.0
            omega_is_rad_per_s: 0.0
            omega_ds_rad_per_s: 0.0
            ki2_per_s2: 0.0
            setpoint_v: 0.0
            offset_v: 0.0
            u_min_v: !expr "-offline.params.out_range_v"
            u_max_v: !expr "offline.params.out_range_v"
            toggles: {feedback: true, p_term: false, i_term: true, d_term: false}
      actuators:
        - seq:
            - block: dac
              name: dac0f
              params:
                in: ctrl.sup0.u
                out: v.dac0f
                device: fpga_generic
                bits: !expr "offline.params.dac_bits"
                range_v: [-0.5, 0.5]     # = ±out_range_v (fpga_generic)
                noise_vrms: 0.0
                r_out_ohm: 50.0
                r_load_ohm: .inf
                toggles: {quantization: true, noise: false, saturation: true}
            - block: delay_buffer
              name: dl0f
              params: {in: v.dac0f, out: delay.dl0f.out, method: linear,
                       tau_s: !expr "offline.params.latency_s - 1.0 / run.f_sim_hz"}   # D55-1
            - block: pzt_fiber_stretcher
              name: pzt0
              params:
                in: delay.dl0f.out
                gain_mode: direct
                k_rad_per_v: !expr "offline.params.pzt_k_rad_per_v"
                polarity: 1.0
                modes: [{f_hz: !expr "offline.params.pzt_f_res_hz", q: !expr "offline.params.pzt_q", r: 1.0}]
                discretisation: tustin
                prewarp_hz: !expr "offline.params.pzt_f_res_hz"
                drive_min_v: !expr "-offline.params.out_range_v"
                drive_max_v: !expr "offline.params.out_range_v"
                hysteresis_frac: 0.0     # not documented; toggle off
                segment: F0
                driver: stretcher
                n_sub: 1
                sub: [0, 1]
                ring_len: 0
                insertion_loss_lin: null # booked in loss_budget (str0)
                toggles: {resonance: true, hysteresis: false, saturation: true, insertion_loss: false}
          name: act0f
        - seq:
            - block: delay_buffer        # TEC transport delay τ_tr = 0 [AE] (closes the TEC loop through a delay buffer)
              name: dl0s
              params: {in: ctrl.pid0s.u, out: delay.dl0s.out, method: linear, tau_s: 0.0}
            - block: thermal_actuator    # spool TEC of port 0 (writes ΔT, G08)
              name: tec0
              rate_div: !expr "offline.params.tec_rate_div"
              params:
                in: delay.dl0s.out
                segment: F0
                driver: tec
                n_sub: 1
                sub: [0, 1]
                ring_len: 0
                k_t_k_per_v: !expr "offline.params.tec_k_t_k_per_v"
                tau_th_s: !expr "offline.params.tec_tau_th_s"
                dt_min_k: !expr "-offline.params.tec_dt_max_k"
                dt_max_k: !expr "offline.params.tec_dt_max_k"
                toggles: {saturation: true}
          name: act0s
    name: lock0.stack
  # ---- L-Liu, port k ------------------------------------------------------------------------------------------------------
  - block: liu_probe_interferometer
    name: liu1
    params:
      mode: homodyne_dc
      in_pr: beam.pr1.phi
      in_ref: beam.ref1.phi
      out: v.liu1
      p_pr_avg_w: !expr "offline.params.p_pr_avg_w"
      p_ref_w: !expr "offline.params.p_ref_w"
      duty: !expr "offline.params.probe_duty"
      visibility: !expr "offline.params.liu_visibility"
      coupler_sign: 1.0
      v_off_v: 0.0
      responsivity_a_per_w: !expr "offline.params.liu_responsivity_a_per_w"
      gain_v_per_a: !expr "offline.params.liu_gain_v_per_a"
      i_n_a_rthz: !expr "offline.params.liu_i_n_a_rthz"
      toggles: {shot_noise: true, electronic_noise: true, gating: true}
  - block: adc
    name: adc1
    params:
      in: v.liu1
      out: v.adc1
      device: fpga_generic
      noise_vrms: 0.0
      avg_samples: 1
      toggles: {quantization: true, noise: false, saturation: true}
  - stack:
      stages:
        - seq:
            - block: pid
              name: pid1f
              params:
                in: v.adc1
                out: ctrl.pid1f.u
                device: fpga_generic
                anti_windup: clamp
                kp: 0.0
                ki_per_s: !expr "2 * pi * offline.params.f_u_hz / (offline.params.liu_k_v * offline.params.pzt_k_rad_per_v)"
                kd_s: 0.0
                omega_is_rad_per_s: 0.0
                omega_ds_rad_per_s: 0.0
                ki2_per_s2: 0.0
                setpoint_v: 0.0
                offset_v: 0.0
                u_min_v: !expr "-offline.params.out_range_v"
                u_max_v: !expr "offline.params.out_range_v"
                toggles: {feedback: true, p_term: false, i_term: true, d_term: false}
            - block: lock_supervisor
              name: sup1
              params:
                u_in: ctrl.pid1f.u
                e_in: v.adc1
                true_in: lock.L1.err
                out: ctrl.sup1.u
                relock: fringe_hop
                u_min_v: !expr "-offline.params.out_range_v * (1 - 2.0 ** (1 - offline.params.dac_bits))"
                u_max_v: !expr "offline.params.out_range_v * (1 - 2.0 ** (1 - offline.params.dac_bits))"
                t_sat_s: 0.0
                e_th: 1.0e+9
                t_e_s: 0.0
                t_hop_s: 1.0e-3
                u_2pi_v: !expr "2 * pi / offline.params.pzt_k_rad_per_v"
                toggles: {relock: false}
          name: stage1f
        - block: pid
          name: pid1s
          rate_div: !expr "offline.params.tec_rate_div"
          params:
            in: ctrl.sup1.u
            out: ctrl.pid1s.u
            device: fpga_generic
            anti_windup: clamp
            kp: 0.0
            ki_per_s: !expr "2 * pi * offline.params.f_12_hz * offline.params.pzt_k_rad_per_v / offline.params.tec_k_rad_per_v_k"
            kd_s: 0.0
            omega_is_rad_per_s: 0.0
            omega_ds_rad_per_s: 0.0
            ki2_per_s2: 0.0
            setpoint_v: 0.0
            offset_v: 0.0
            u_min_v: !expr "-offline.params.out_range_v"
            u_max_v: !expr "offline.params.out_range_v"
            toggles: {feedback: true, p_term: false, i_term: true, d_term: false}
      actuators:
        - seq:
            - block: dac
              name: dac1f
              params:
                in: ctrl.sup1.u
                out: v.dac1f
                device: fpga_generic
                bits: !expr "offline.params.dac_bits"
                range_v: [-0.5, 0.5]
                noise_vrms: 0.0
                r_out_ohm: 50.0
                r_load_ohm: .inf
                toggles: {quantization: true, noise: false, saturation: true}
            - block: delay_buffer
              name: dl1f
              params: {in: v.dac1f, out: delay.dl1f.out, method: linear,
                       tau_s: !expr "offline.params.latency_s - 1.0 / run.f_sim_hz"}
            - block: pzt_fiber_stretcher
              name: pzt1
              params:
                in: delay.dl1f.out
                gain_mode: direct
                k_rad_per_v: !expr "offline.params.pzt_k_rad_per_v"
                polarity: 1.0
                modes: [{f_hz: !expr "offline.params.pzt_f_res_hz", q: !expr "offline.params.pzt_q", r: 1.0}]
                discretisation: tustin
                prewarp_hz: !expr "offline.params.pzt_f_res_hz"
                drive_min_v: !expr "-offline.params.out_range_v"
                drive_max_v: !expr "offline.params.out_range_v"
                hysteresis_frac: 0.0
                segment: F1
                driver: stretcher
                n_sub: 1
                sub: [0, 1]
                ring_len: 0
                insertion_loss_lin: null
                toggles: {resonance: true, hysteresis: false, saturation: true, insertion_loss: false}
          name: act1f
        - seq:
            - block: delay_buffer
              name: dl1s
              params: {in: ctrl.pid1s.u, out: delay.dl1s.out, method: linear, tau_s: 0.0}
            - block: thermal_actuator
              name: tec1
              rate_div: !expr "offline.params.tec_rate_div"
              params:
                in: delay.dl1s.out
                segment: F1
                driver: tec
                n_sub: 1
                sub: [0, 1]
                ring_len: 0
                k_t_k_per_v: !expr "offline.params.tec_k_t_k_per_v"
                tau_th_s: !expr "offline.params.tec_tau_th_s"
                dt_min_k: !expr "-offline.params.tec_dt_max_k"
                dt_max_k: !expr "offline.params.tec_dt_max_k"
                toggles: {saturation: true}
          name: act1s
    name: lock1.stack
  # ---- metrics (conv §10, D12, D31, D46, G13) -----------------------------------------------------------------------------
  - block: metric_i
    name: mi
    params:
      ports: all
      setpoint_rad: !pi_frac -0.5        # each lock holds its stretcher at ≈ +π/2 (header)
      t_settle_s: 0.005
  - block: metric_ii
    name: mii
    params:
      ports: all
      setpoint_rad: 0.0
      t_settle_s: 0.005

measure:
  record:
    slots: [lock.L0.err, lock.L1.err, v.adc0, v.adc1, act.pzt0.dpsi, act.pzt1.dpsi, act.tec0.dT, act.tec1.dT,
            timing.delay1.dt]
    decim: 10
    antialias: none
  metrics:
    i:
      f_max_hz: !expr "offline.params.f_max_metric_hz"
      weight: null
      source: src
      lo_mode: optimal                 # WP-I5 addition: the source's optimal LO mode (None for single-mode / CW bases)
      average: exact
      include_hf_phase_noise: true
      dither_m_rad: []
    ii:
      f_max_hz: !expr "offline.params.f_max_metric_hz"
      weight: null
      source: src
      lo_mode: optimal
      average: exact
      include_hf_phase_noise: true
      dither_m_rad: []
  decompose:                           # metric (ii) components (G13, conv §10, D57-4); every Θ-relevant source listed
    groups:
      locked_path_residual: [env.thermal.F0.drift, env.thermal.F1.drift, env.mech.ports.mech, env.mech.fs_lock.mech,
                             liu0.shot_noise, liu0.electronic_noise, liu1.shot_noise, liu1.electronic_noise]
      common_points: [env.mech.dist.mech]
      laser_decorrelation_oob: [laser.fm_white]
      squeezed_only: [env.mech.fs_sq.mech, env.thermal.xtal.drift, dmx0.drive_phase_noise, dmx0.bias_drift,
                      dmx1.drive_phase_noise, dmx1.bias_drift]
    validity:
      - {slot: act.pzt0.sat, abs_max: 0.5}
      - {slot: act.pzt1.sat, abs_max: 0.5}
      - {slot: act.tec0.sat, abs_max: 0.5}
      - {slot: act.tec1.sat, abs_max: 0.5}
      - {slot: lock.sup0.n_loss, abs_max: 0.5}
      - {slot: lock.sup1.n_loss, abs_max: 0.5}
