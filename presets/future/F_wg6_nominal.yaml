# F_wg6 at one representative point of every sweep axis (single runs, integration tests).
extends: F_wg6
overlays: [points/F_common_nominal.yaml]

offline:
  params:
    tau_p_s: 1.0e-12               # 00_summary §2.2 (1 ps)
    opa_peak_pump_w: 0.146         # r = 1.15 in the single-mode stand-in [AE]
    dmx_t_stage: 0.98              # T11 centre
    dmx_er_db: 23.0                # T11
    dmx_t_rise_s: 8.0e-9           # T11
    dmx_f_tog_max_hz: 3.0e+6       # T11 upper value (per-pulse routing at 6 MHz needs 3 MHz, T11 §7)
    bhd_bandwidth_hz: 5.0e+7       # [AE] axis centre
