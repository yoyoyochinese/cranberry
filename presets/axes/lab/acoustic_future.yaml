# Lab axis (future presets F_*: the F_common port fibres F0/F1 and LO delivery fibres LO0/LO1): the Ref D table-shaped
# acoustic phase noise of lab/acoustic.yaml, transferred to the future spools (D85-1). Same table, same split rule and
# the same axes; read lab/acoustic.yaml for the shape, its extrapolation and the per-arm split.
#
# PROVENANCE: calibrated on the Ref D measurement after the blind comparison (D81, D85-1). The future spools see
# the table mostly ABOVE 3 kHz, where it is extrapolated: label every acoustic_gamma = 1 result "EXTRAPOLATED above
# 3 kHz" (Phase 5 review B-1: 161 mrad above 3 kHz at F_liu20 port 1 with f⁻², 144 mrad with f⁻⁴ above 10 kHz).
# acoustic_rho_arms only sets the per-arm level inferred from Ref D (B-6); the port-to-port correlation of the
# future fibres stays rho_ports.
# TRANSFER (assumption): the per-arm Ref D noise is applied to every port / LO fibre:
#   * acoustic_gamma = 1: S = (L/13.2 m)·T, i.e. the Ref D noise per metre of fibre (a 100 m spool gets 7.6× the
#     Ref D two-arm sum); appropriate if the pickup is distributed along the fibre;
#   * acoustic_gamma = 0: each fibre gets one Ref D arm's share T/2 whatever its length; appropriate if the pickup
#     is in the coil / mounts (spooled fibres in a box), the reading this overlay was introduced to test.
# The distribution (env.mech.dist) and free-space (env.mech.fs_*) blocks keep their two-pole models. The port
# correlation (rho_ports, D13 pair axis) and the spatial structure of F0/F1 are unchanged. F_common's two-pole axes
# (h_ref_spool_rad2_hz, mech_gamma) stay because env.mech.dist / env.mech.fs_* still use mech_gamma / their own h_ref.
offline:
  params:
    acoustic_scale: !sweep_log [0.1, 10.0, 5]
    acoustic_gamma: !choice [0.0, 1.0]
    acoustic_L_ref_m: 13.2                      # Ref D L_a1 + L_a2 at refD_nominal (lab/acoustic.yaml)
    # B-1 (Phase 6 fix): the table is MEASURED only on 100 Hz – 3 kHz. Above 3 kHz it is an assumption that sets most of
    # the out-of-band variance once scaled up (γ = 1 future spools: ×80–240). Axes: the slope above a corner (f⁻² as
    # before, or f⁻⁴ through a smooth first-order corner), the corner (10 kHz). Any result with acoustic_gamma = 1 is to be
    # labelled "EXTRAPOLATED above 3 kHz" (acoustic_provenance is recorded in config.resolved.yaml).
    acoustic_hf_slope: !choice [2.0, 4.0]       # PSD slope above the corner (assumption; 2 = the D89 table, 4 = the table
                                                # × 1/(1 + (f/corner)²): segment_mech_noise table_hf_pole_hz)
    acoustic_hf_corner_hz: 1.0e+4               # corner of the steeper slope (assumption)
    acoustic_extrapolated_above_hz: 3000.0      # the measured table ends here (COMPARISON §3 (A))
    acoustic_provenance: "Ref D table, calibrated after the blind comparison (D81, D85-1); EXTRAPOLATED above 3 kHz and below 100 Hz"
    # B-6 (Phase 6 fix): arm-to-arm correlation of the pickup. The measured PSD is that of φ_lo − φ_pr, so with
    # correlation ρ the per-arm PSD is larger: S_diff = S1 + S2 − 2ρ√(S1 S2) is kept at T by the factor
    # 1/(1 − 2ρ√(s1 s2)/(s1 + s2)) (γ = 0: 1/(1 − ρ); γ = 1 at the calibration lengths 11.1 / 2.1 m: 1/(1 − 0.732ρ)).
    # ρ = 0 (D89-3) is the lower bound of the per-arm level, not a measurement.
    acoustic_rho_arms: !sweep [0.0, 0.8, 3]
    acoustic_rho_comp: !expr "1.0 / (1.0 - acoustic_rho_arms * (1.0 if acoustic_gamma == 0 else 2.0 * sqrt(11.1 * 2.1) / 13.2))"
    acoustic_arm_scale: !expr "acoustic_scale * (0.5 if acoustic_gamma == 0 else 1.0) * acoustic_rho_comp"
pipeline:
  - name: env.mech.ports
    params: &acoustic
      mech_shape: table
      gamma: !expr "offline.params.acoustic_gamma"
      L_ref_m: !expr "offline.params.acoustic_L_ref_m"
      psd_table:
        - [10.0, !expr "offline.params.acoustic_arm_scale * 6.32e-4"]     # assumption: f^−1.5 below 100 Hz
        - [100.0, !expr "offline.params.acoustic_arm_scale * 2.0e-5"]     # COMPARISON §3 (A)
        - [300.0, !expr "offline.params.acoustic_arm_scale * 3.6e-6"]     # COMPARISON §3 (A)
        - [1000.0, !expr "offline.params.acoustic_arm_scale * 6.7e-7"]    # COMPARISON §3 (A)
        - [3000.0, !expr "offline.params.acoustic_arm_scale * 9.0e-8"]    # COMPARISON §3 (A)
        - [30000.0, !expr "offline.params.acoustic_arm_scale * 9.0e-10"]  # assumption: f^−2 above 3 kHz (EXTRAPOLATED;
                                                                          # × 1/(1 + (f/corner)²) with acoustic_hf_slope 4)
      table_f_min_hz: 10.0
      table_f_max_hz: 30000.0
      table_per_decade: 4
      table_hf_pole_hz: !expr "offline.params.acoustic_hf_corner_hz if offline.params.acoustic_hf_slope > 2 else inf"   # f⁻⁴ synthesis (B-1)
  - name: env.mech.lo
    params: *acoustic
