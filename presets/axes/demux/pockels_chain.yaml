# Demux axis: chain layout (PC + PBS in series, port k leaves at stage k + 1; D39 "木構造と鎖状", T11 §3.2): the port's
# loss grows with k (k + 1 stages), unlike the tree (S = 5 for every port). demux_switch derives the stages of each
# port from the layout (port 0: stage 1, port k: stages 1…k + 1, stage 1 shared; M4-01).
offline:
  params:
    dmx_layout: chain
