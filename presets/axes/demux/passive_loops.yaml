# Demux axis: passive delay loops (Liu / Borealis type, D39 (c)): no active switch, ε = 0, no feasibility check;
# t_stage is the per-mode interferometer transmission (Liu ≈ 99 %/mode [L-Methods]); no switch drive noise.
offline:
  params:
    dmx_switching: passive
    dmx_t_stage: 0.99              # [L-Methods] interferometer 99 %/mode
pipeline:
  - name: dmx0
    params:
      toggles: {enabled: false}
  - name: dmx1
    params:
      toggles: {enabled: false}
