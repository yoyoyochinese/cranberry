# Controller axis: Thorlabs DSC1 (devices/dsc1.yaml; D05, D35), the model validated on Ref D (D61-2, D82, D91):
#   * ADC 16 bit ±4 V with the 2-point average, DAC 12 bit ±4 V (CV limit ±4 V, D35);
#   * PID law dsc1 (backward-Euler integral including e[n], backward difference; DSC1 p.19) with pid0f / pid1f, sup*
#     and dac*f at the device's 500 kHz (D91-1: rate_div 2 at f_sim = 1 MHz, h = 2 µs); chk.lock_stability uses
#     discretisation dsc1 with that h (D82 lesson). The TEC stage pid*s runs the dsc1 law at its own 10 ms rate
#     (its extra K_i·h/2 is ωh/2 ≤ 1 % of the I term at f_12 ≤ 0.3 Hz; chk keeps it continuous);
#   * B-7: τ_L and the input / output poles are a PAIR (refD.yaml, T15 §2.7(b)): 5.7 µs WITH the 120 kHz input and
#     100 kHz output first-order poles, or 8.3 µs pure delay without them — the dsc1_latency_s choice switches both.
#   * D91-1 / D61-2 delay accounting: τ_L already contains the ADC average and the 500 kHz ZOH, so the time loop's delay
#     lines carry τ_L − 1/f_sim − ctrl_explicit_delay_s (ADC average (2−1)/(2 f_sim) + hold (r−1)/(2 f_sim) = 1 µs at
#     1 MHz) and the checks add no ZOH half sample (zoh_delay_s 0). Both checks see total delay τ_L, the poles, the law.
# The adc average and rate_div are counted in base samples of f_sim = 1 MHz (DSC1 1 MHz ADC, 500 kHz update).
# G-3: writes only offline.params (full controller set), composes with gate/* and probe/* in either order.
offline:
  params:
    ctrl_device: dsc1
    adc_bits: 16                   # DSC1 p.2
    adc_range_v: 4.0               # DSC1 p.2 (±4 V)
    adc_avg_samples: 2             # DSC1 p.1 (averages every two 1 MHz samples)
    pid_law: dsc1                  # DSC1 p.19
    chk_law: dsc1                  # D82
    pid_update_hz: 5.0e+5          # DSC1 p.2 (PID update 500 kHz)
    pid_rate_div: !expr "max(1, floor(run.f_sim_hz / pid_update_hz + 0.5))"   # 2 at 1 MHz (D91-1)
    dsc1_latency_s: !choice [5.7e-6, 8.3e-6]   # τ_L: 5.7 µs with the 120/100 kHz poles, 8.3 µs pure delay (T15 §2.7(b), B-7)
    ctrl_latency_s: !expr "dsc1_latency_s"   # the L-Liu controller only (locks/ loops keep latency_s)
    ctrl_in_pole_hz: !expr "1.2e+5 if dsc1_latency_s < 7.0e-6 else inf"   # DSC1 p.1 (120 kHz typ; order not stated)
    ctrl_out_pole_hz: !expr "1.0e+5 if dsc1_latency_s < 7.0e-6 else inf"  # DSC1 p.2 note d (100 kHz)
    zoh_delay_s: 0.0               # inside τ_L (D61-2)
    ctrl_dac_bits: 12              # DSC1 p.2 (12-bit output)
    out_range_v: 4.0               # D35 CV limit −4…+4 V
