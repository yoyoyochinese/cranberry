# Bench controller axis (D85-12): Ref A's two locks on Thorlabs DSC1 units (one DSC1 per lock: it has one input and one
# output, DSC1 p.1–2). Applies to refA and refA + bench/refA_fiber. presets/axes/controller/dsc1.yaml is the F_common
# version (its block names differ); refA's own controller is fpga_generic (the paper's "hand-made PID servo").
#
# KEPT AS A BAD CONFIGURATION (D34): the DSC1 is far too slow for a Ref A-type OPA lock. Ref A's family runs the
# probe–squeezer lock with a 2 MHz demodulation and EOM actuators whose loop phase reaches −180° at ≈ 2–4 MHz [K23 p.4,
# lit-kashiwazaki2023 §0-4]; the DSC1 updates at 500 kHz with a 120 kHz input band and an 8.3 µs loop latency, so −180°
# of a pure I loop sits at 1/(4τ) ≈ 30 kHz and the unity-gain frequency is capped at a few 10 kHz. refA's 20 kHz unity
# gain ([AE] in refA) is at the edge: chk.lock1/lock2_stability report the margin (tests/integration/test_p6_bench.py).
# The demodulation (2 f_sh = 2 MHz, f_sh = 1 MHz) cannot run on the DSC1 (its input band is 120 kHz): refA's analogue
# demodulator blocks dem1 / dem2 stay in front of it, as an external mixer + low pass would.
#
# What this overlay changes (the loop gains of refA are untouched, as controller/dsc1 does for F_common):
#   * adc1/adc2: DSC1 ADC (16 bit, ±4 V, DSC1 p.2); avg_samples stays 1 (the 2-point average is inside τ_L below).
#   * pid1/pid2: DSC1 law (device dsc1: discretisation dsc1, DSC1 p.19) updated at 500 kHz (DSC1 p.2): rate_div =
#     f_sim·h (h = 2 µs, DSC1 p.20); output limits ±4 V (D35 CV limits).
#   * dac1/dac2: 12 bit, ±4 V, 220 Ω (DSC1 p.2), same 500 kHz update. One LSB = 1.95 mV = 1.75 mrad on the EOM (V_π 3.5 V).
#   * dl1/dl2: loop latency τ_L = 8.3 µs (T15 §2.7(b) pure-delay form, dsc1.yaml loop.latency_s; the 120 / 100 kHz
#     in/out poles of the 5.7 µs form are not modelled here) minus 1/f_sim (D55-1) minus the explicitly modelled hold of
#     the 500 kHz update (rate_div − 1)/(2 f_sim) (D61-2).
#   * Stability checks (D82 lesson, D89-5: the check models the controller law the time loop runs): new
#     chk.lock1_stability / chk.lock2_stability (refA has none) with discretisation dsc1, h = 2 µs, delay τ_L, the
#     demodulator low pass as a pole; k0 = refA's plant gains (the denominators of pid1 / pid2 ki in refA.yaml), ki read
#     from the pid blocks. Lock 1 and lock 2 are checked separately (lock-1 error enters Δ only × A−/A+, refA header).
offline:
  params:
    ctl_latency_s: 8.3e-6           # DSC1 loop latency, pure-delay form (T15 §2.7(b), dsc1.yaml loop.latency_s)
    ctl_h_s: 2.0e-6                 # DSC1 update period (DSC1 p.20, p.2: 500 kHz)
    ctl_rate_div: !expr "floor(run.f_sim_hz * ctl_h_s + 0.5)"   # 40 at refA's 20 MHz
  blocks:
    - block: loop_stability_check
      name: chk.lock1_stability
      params:
        k0: !expr "0.08 * 4.95 * 2 * pi / 3.5"            # refA pid1: plant K = GℜηP_in ΔG (0.08 · 4.95) · 2π/V_π
        kp: 0.0
        ki_per_s: !expr "pipeline.pid1.params.ki_per_s"
        kd_s: 0.0
        discretisation: dsc1
        h_s: !expr "offline.params.ctl_h_s"
        delay_s: !expr "offline.params.ctl_latency_s"
        poles_hz: [!expr "pipeline.dem1.params.lpf_hz"]
        modes: []                                         # EOM: static (refA eom1 poles [])
        f_grid_hz: [1.0, 1.0e+8, 200001]
        toggles: {enabled: true}
    - block: loop_stability_check
      name: chk.lock2_stability
      params:
        k0: !expr "1.0e4 * 2 * 1.2338 * sqrt(0.0154 * 1.6e-9) * pi / 3.5"   # refA pid2: K2·A+·π/V_π (T14 §3.4)
        kp: 0.0
        ki_per_s: !expr "pipeline.pid2.params.ki_per_s"
        kd_s: 0.0
        discretisation: dsc1
        h_s: !expr "offline.params.ctl_h_s"
        delay_s: !expr "offline.params.ctl_latency_s"
        poles_hz: [!expr "pipeline.dem2.params.lpf_hz"]
        modes: []
        f_grid_hz: [1.0, 1.0e+8, 200001]
        toggles: {enabled: true}
pipeline:
  - name: adc1
    params: {device: dsc1, bits: 16, range_v: [-4.0, 4.0]}
  - name: pid1
    rate_div: !expr "offline.params.ctl_rate_div"
    params: {device: dsc1, discretisation: dsc1, u_min_v: -4.0, u_max_v: 4.0}
  - name: dac1
    rate_div: !expr "offline.params.ctl_rate_div"
    params: {device: dsc1, bits: 12, range_v: [-4.0, 4.0], r_out_ohm: 220.0}
  - name: dl1
    params: {tau_s: !expr "offline.params.ctl_latency_s - 1.0 / run.f_sim_hz - (offline.params.ctl_rate_div - 1) / (2 * run.f_sim_hz)"}
  - name: adc2
    params: {device: dsc1, bits: 16, range_v: [-4.0, 4.0]}
  - name: pid2
    rate_div: !expr "offline.params.ctl_rate_div"
    params: {device: dsc1, discretisation: dsc1, u_min_v: -4.0, u_max_v: 4.0}
  - name: dac2
    rate_div: !expr "offline.params.ctl_rate_div"
    params: {device: dsc1, bits: 12, range_v: [-4.0, 4.0], r_out_ohm: 220.0}
  - name: dl2
    params: {tau_s: !expr "offline.params.ctl_latency_s - 1.0 / run.f_sim_hz - (offline.params.ctl_rate_div - 1) / (2 * run.f_sim_hz)"}
