# Bench axis (D84-2 axis 1, D85-12 (a)): Ref A-type CW waveguide OPA with a PM fibre of length L between the squeezer
# and the BHD. Base: refA (presets/reference/refA.yaml); refA itself is unchanged (D34). Named runnable form:
# presets/bench/refA_fiber_bench.yaml.
#
#   squeezer → SQ = PM fibre (L_sq_fiber_m, 1–100 m, log axis) → BHD          (was 1 m free space in refA)
#   LO       → LO = PM fibre (5 m, refA [AE]) + lo_route:  fiber_matched: + L (an equal-length fibre next to SQ)
#                                                          free_space:    unchanged (LO stays on the table)
#
# What changes against refA (all on this overlay):
#   * SQ becomes `kind: pm` (n_g 1.468, T08 as refA's PR / LO fibres) with drivers strain + dT; coefficients
#     strain k_ε·L (conv §4, T16 ξ_eo 0.78, refA's own k_ε) and dT k_T·L, κ_τ·L (T08 §2.2, §2.3 nominal 44 rad/(m·K),
#     39 ps/(km·K)). The LO fibre carries the same rows with its own length (refA's `* 5.0` rows restated with L_lo_m).
#     refA's coef list has no ids, so the whole list is restated here (the other rows are refA's values unchanged).
#   * Environment: SQ joins the acoustic block `mech` (refA's two-pole T08 §2.5 model, now [PR, LO, SQ]); a thermal
#     block `env.thermal.fiber` (SQ, LO; refA has none) runs before the path model (refA's `mech` element is replaced
#     by the seq [env.thermal.fiber, mech] so the order stays writer → reader). The table-shaped lab noise (the
#     lab/acoustic equivalent) is the companion overlay bench/refA_fiber_acoustic.yaml.
#   * pr_bhd (the probe residual through the squeezer) co-propagates through SQ with the squeezed light, so the SQ
#     fibre phase is common to the lock-2 sensor and to θ_sq: lock 2 (BHD probe–LO beat → EOM2 on the LO) removes it
#     inside its band; what stays is its out-of-band part and the LO fibre (fiber_matched), which is not common.
#   * LO–squeezed delay mismatch: the emission-time delays come from the topology (beam_assembler) and the laser's
#     filter-cavity ledger pair reads the same lengths (refA's single-source exprs `tau_ref_s` / `fc.in_delay_s`).
#     refA: 16.8 ns (LO later). fiber_matched: n_g·5 m + 0.3 m − 1.6 m(sq. free space) ≈ 20.1 ns for every L.
#     free_space: (7.64 − 1.60 − 1.468·L)/c, i.e. −0.47 µs at 100 m (2π²h0·|δτ| grows ∝ L; header of refA).
#     Since the LO filter cavity low-passes (delays) the LO's laser phase, a squeezed path somewhat LONGER than the LO
#     path partly compensates it: free_space θ falls from 9.0 mrad (1 m) to 6.0 mrad (10 m) before the delay term takes
#     over (20.6 mrad at 100 m; reviews/scripts/p6_bench_smoke.py, Koheras stand-in h0).
#   * Fibre loss on the squeezed path (loss_budget `optics`): attenuation 0.5 dB/km (Corning PANDA PM max, T12 §3.2)
#     and coupling free space → fibre 0.98 (T12 §4.2) × fibre → free space at the BHD (UNVERIFIED axis, no source:
#     0.98 = assumed equal to the in-coupling, 0.95 / 0.90 = worse). The LO loss does not enter (strong LO).
#   * Lock-2 range: refA's lock 2 is EOM-only (±0.5 V at V_π 3.5 V = ±0.45 rad). With tens of metres of fibre the
#     f⁻² acoustic / thermal phase leaves that range within a fraction of a second (100 m: 0.40 V of the ±0.5 V EOM drive after
#     20 ms in a short run). As in Ref A's family [K23 p.3] the EOM output is offloaded to a fibre stretcher on the LO
#     (pid2s → dac2s → dl2s → fs2 on the zero-length segment LO_fs in the LO path; refC-style offload, positive I gain
#     2π·f_12·(π/V_π)/k_fs). EOM-only (the refA wiring, a bad configuration for long fibres) = --toggle pid2s.feedback=false.
#   * Lock-2 demodulation phase: the probe pr_bhd is 1 MHz above the carrier, so the fibre adds 2π·f_sh·Δτ to its phase
#     at the BHD; dem2.phi_d_rad absorbs it (pr_bhd_static_extra_rad below).
#   * Not changed (recorded): the squeezed–LO mode overlap `mm` keeps refA's 0.96 (a fibre-delivered squeezed mode
#     may match a fibre LO better or worse: unknown); the probe power into the BHD (bhdbeat p_pr_w) is not reduced by
#     the fibre loss (≤ 10 % of the lock-2 gain).
#
# Lab apparatus (D85-12, our bench: Cobrite DX1 1548.8 nm CW, 914/915B stretcher, DSC1, PDB450C, Moku:Delta). Ref A runs
# at 1545.32 nm with an NKT Koheras Harmonik seed + EDFA + SHG (772.66 nm pump) and a 0.64 W pump into a 45 mm PPLN
# waveguide; this overlay KEEPS THE PAPER VALUES. What would change on our bench (not modelled here):
#   * laser: DX1 SC white FM h0 = 2.55e4 Hz²/Hz (80 kHz FWHM, D35) vs the Koheras stand-in 64 (0.2 kHz, UNVERIFIED):
#     ×400 on every laser term. The LO filter-cavity term π·h0/Δν_FC becomes 0.024 rad² (155 mrad) and the delay term
#     2π²h0·δτ is 0.010 rad² at refA's 20 ns and 0.24 rad² (0.49 rad) at 100 m free_space: with the DX1 the LO must be
#     delay-matched to ≲ 1 ns and the filter cavity re-designed (Δν_FC is the tuned refA value, D65-5).
#     bench/refA_laser_dx1.yaml switches the laser only (h0 of D35), for this comparison.
#   * wavelength 1548.8 vs 1545.32 nm: k_ε, k_T and the responsivities change by 0.2 % (λ0 is written into refA's
#     coefficients; not re-evaluated). A 774.4 nm pump needs its own SHG / PPLN period (no such hardware on the bench).
#   * squeezer: no waveguide OPA, SHG or 0.64 W pump on our bench; the source block stays Ref A's (opa_waveguide).
#   * controller: refA's "hand-made PID servo" is fpga_generic; bench/dsc1_refA.yaml and bench/moku_delta_refA.yaml
#     are the bench controllers (the DSC1 is far too slow for a Ref A-type OPA lock: see dsc1_refA.yaml).
run:
  seed_mode: per_point             # D56-2 (required by sweeps; refA has no axes and sets none)

offline:
  params:
    L_sq_fiber_m: !sweep_log [1.0, 100.0, 5]    # D85-12 (a): bench fibre 1–100 m between squeezer and BHD
    lo_route: !choice [fiber_matched, free_space]   # D85-12 (a) variants (header)
    n_g_pm: 1.468                               # PM fibre group index, as refA's PR / LO fibres (T08 §1) UNVERIFIED for the part
    L_lo_m: !expr "5.0 + (L_sq_fiber_m if lo_route == 'fiber_matched' else 0.0)"   # refA LO fibre 5 m [AE] + matched fibre
    k_eps_pm_rad_per_m: !expr "0.78 * 2 * pi * 1.468 / 1545.32e-9"   # = refA mech / coef k_ε (conv §4, T16 ξ_eo, λ0 [Ref A §3.1])
    k_T_pm_rad_per_m_K: 44.0                    # thermal phase coefficient, T08 §2.2 nominal (refD_nominal value)
    kappa_tau_pm_s_per_m_K: 3.9e-14             # 39 ps/(km·K), T08 §2.3 (Slavík 2015)
    fiber_r_T_k_per_s: 1.0e-4                   # ambient drift rate, T08 §6 example (refD_nominal value)
    fiber_tau_th_s: 300.0                       # ambient → fibre lag, T08 §2.4 nominal
    alpha_pm_db_per_km: 0.5                     # Corning PANDA PM max 0.5 dB/km (T12 §3.2, F_common value)
    eta_fiber_in: 0.98                          # free space → fibre coupling (T12 §4.2, F_common eta_up factor)
    eta_fiber_out: !choice [0.98, 0.95, 0.90]   # fibre → free space at the BHD: UNVERIFIED (no source; header)
    # lock-2 demodulation phase (header): the probe pr_bhd runs f_sh = 1 MHz above the carrier, so the fibre adds
    # 2π·f_sh·Δτ to its phase at the BHD against the RF reference (Δτ = (n_g·L − 1.0003·1 m)/c over refA's 1 m of free
    # space); dem2.phi_d_rad absorbs it as an experimenter re-tunes the demodulation phase (refA's own convention:
    # static phases are absorbed into demodulation phases). Without it the lock-2 slope falls as cos(2π f_sh Δτ)
    # and changes sign near L ≈ 100 m (Δτ ≈ 0.49 µs ≈ 1/(2 f_sh)): pr_bhd_static_absorb: false keeps that (bad) variant.
    pr_bhd_static_absorb: true
    # lock-2 offload to a fibre stretcher on the LO (header): Ref A's family runs EOM (fast) + fibre stretcher (slow, I,
    # wide range) on the LO path [K23 p.3, Fig. 2(a), lit-kashiwazaki2023 §0-5]; model, range and crossover unpublished:
    lo_fs_range_rad: 32.5                       # half range at ±0.5 V: 915B-like placeholder (T16 §7.2) UNVERIFIED
    lo_fs_f_res_hz: 2.0e+4                      # 915B nominal 20 kHz (T15 §2.7(d) placeholder, refD_nominal) UNVERIFIED
    lo_fs_q: 10.0                               # T15 §2.7(d) placeholder (refD_nominal) UNVERIFIED
    lo_f_12_hz: 100.0                           # EOM → stretcher crossover [AE] (≪ refA's 20 kHz unity gain; above the
                                                # f⁻² fibre noise corner region it must follow)
    pr_bhd_static_extra_rad: !expr "(2 * pi * 1.0e6 * (n_g_pm * L_sq_fiber_m - 1.0003 * 1.0) / 299792458.0) if pr_bhd_static_absorb else 0.0"   # f_sh [Ref A §3.1]

  blocks:
    - name: optics
      params:
        elements: !replace               # !replace keeps `observer: null` (a merged-in null would delete the key)
          - {id: components, eta: 0.99, kind: component, applies_to: [gbs, bhd], segment: SQ, observer: null,
             source: "[Ref A §4.2] mirrors and lenses, measured 1 %"}      # refA's element, unchanged
          - {id: sq_fiber_coupling, eta: !expr "offline.params.eta_fiber_in * offline.params.eta_fiber_out", kind: component,
             applies_to: [gbs, bhd], segment: SQ, observer: null,
             source: "T12 §4.2 free space → fibre 0.98 × fibre → free space UNVERIFIED axis (bench/refA_fiber)"}
          - {id: sq_fiber_attenuation, eta: !expr "10 ** (-offline.params.alpha_pm_db_per_km * offline.params.L_sq_fiber_m / 1.0e4)",
             kind: component, applies_to: [gbs, bhd], segment: SQ, observer: null,
             source: "T12 §3.2 Corning PANDA PM 0.5 dB/km max (bench/refA_fiber)"}

topology:
  segments:
    - {id: SQ, kind: pm, L_m: !expr "offline.params.L_sq_fiber_m", n_g: !expr "offline.params.n_g_pm",
       drivers: {strain: uniform, dT: uniform}}                                         # squeezer → BHD through the fibre
    - {id: LO, L_m: !expr "offline.params.L_lo_m", drivers: {dT: uniform}}
    - {id: LO_fs, kind: component, L_m: 0.0, n_g: 1.0, beta2_s2_per_m: 0.0, beta3_s3_per_m: 0.0, zone: table,
       n_sub: 1, spatial: lumped, pol_model: "off", pol_params: {}, drivers: {stretcher: uniform}}   # LO fibre stretcher (offload)
  beams:
    - {id: lo, path: [{segment: LO, direction: 1}, {segment: LO_fs, direction: 1}, {segment: FC, direction: 1}]}
  coef:
    # refA rows (unchanged values; the LO strain row now scales with L_lo_m instead of refA's literal 5.0)
    - {segment: PR, driver: strain, beam: "*", effect: phase, value: !expr "0.78 * 2 * pi * 1.468 / 1545.32e-9 * 5.0"}
    - {segment: PR, driver: strain, beam: "*", effect: group_delay, value: 0.0}
    - {segment: LO, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_pm_rad_per_m * offline.params.L_lo_m"}
    - {segment: LO, driver: strain, beam: "*", effect: group_delay, value: 0.0}
    - {segment: PR, driver: eom, beam: "*", effect: phase, value: 1.0}
    - {segment: PR, driver: eom, beam: "*", effect: group_delay, value: 0.0}
    - {segment: LO, driver: eom, beam: "*", effect: phase, value: 1.0}
    - {segment: LO, driver: eom, beam: "*", effect: group_delay, value: 0.0}
    - {segment: LO, driver: stretcher, beam: "*", effect: phase, value: 1.0}
    - {segment: LO, driver: stretcher, beam: "*", effect: group_delay, value: 0.0}
    # new rows: SQ fibre and LO fibre temperature (T08 eq. 2.1, 2.4), SQ strain (as refA's fibres; group delay n_g·L/c, refD)
    - {segment: SQ, driver: strain, beam: "*", effect: phase, value: !expr "offline.params.k_eps_pm_rad_per_m * offline.params.L_sq_fiber_m"}
    - {segment: SQ, driver: strain, beam: "*", effect: group_delay, value: !expr "offline.params.n_g_pm * offline.params.L_sq_fiber_m / 299792458.0"}
    - {segment: SQ, driver: dT, beam: "*", effect: phase, value: !expr "offline.params.k_T_pm_rad_per_m_K * offline.params.L_sq_fiber_m"}
    - {segment: SQ, driver: dT, beam: "*", effect: group_delay, value: !expr "offline.params.kappa_tau_pm_s_per_m_K * offline.params.L_sq_fiber_m"}
    - {segment: LO, driver: dT, beam: "*", effect: phase, value: !expr "offline.params.k_T_pm_rad_per_m_K * offline.params.L_lo_m"}
    - {segment: LO, driver: dT, beam: "*", effect: group_delay, value: !expr "offline.params.kappa_tau_pm_s_per_m_K * offline.params.L_lo_m"}
    - {segment: LO_fs, driver: stretcher, beam: "*", effect: phase, value: 1.0}
    - {segment: LO_fs, driver: stretcher, beam: "*", effect: group_delay, value: 1.05e-15}   # n_g/(n ξ_eo ω0) (T08 §2.3, refC)

pipeline:
  - name: sp                        # refA's segment list + the offload stretcher point LO_fs (FC is written by `fc`)
    params:
      segments: [SHG, PR, LO, LO_fs, CMB, NC_det, NC_sq, XTAL_det, XTAL_sq, SQ]
  - name: dem2                     # lock-2 demodulation phase re-tuned for the fibre (header: probe static phase)
    params:
      phi_d_rad: !expr "-pi / 2 - offline.params.pr_bhd_static_extra_rad"
  - !replace
    name: mech
    seq:
      - block: segment_thermal          # SQ and LO fibre temperature (T08 §2.4); refA has no thermal block
        name: env.thermal.fiber
        params:
          segments: [SQ, LO]
          tau_th_s: {SQ: !expr "offline.params.fiber_tau_th_s", LO: !expr "offline.params.fiber_tau_th_s"}
          r_T_k_per_s: !expr "offline.params.fiber_r_T_k_per_s"
          toggles: {drift: true, random: false, periodic: false}
      - block: segment_mech_noise       # refA's fibre acoustics (T08 §2.5) + the SQ fibre
        name: mech
        params:
          segments: [PR, LO, SQ]
          h_ref_rad2_hz: 0.04            # T08 §2.5 (1 km reference), refA
          L_ref_m: 1000.0
          gamma: 1.0
          f_c_hz: 1000.0
          f_lo_hz: 0.1
          k_eps_rad_per_m: !expr "offline.params.k_eps_pm_rad_per_m"
          toggles: {mech: true, peaks: false, correlation: false}
  # ---- lock-2 offload: EOM2 drive (ctrl.pid2.u) → slow I → fibre stretcher on LO_fs (header; refC's stack form) ----
  - block: pid
    name: pid2s
    params:
      in: ctrl.pid2.u
      out: ctrl.pid2s.u
      device: fpga_generic             # as pid2 (devices/fpga_generic.yaml, Tustin)
      discretisation: tustin
      anti_windup: clamp
      kp: 0.0
      ki_per_s: !expr "2 * pi * offline.params.lo_f_12_hz * (pi / 3.5) / (offline.params.lo_fs_range_rad / 0.5)"   # |C2·k_fs| = k_eom at f_12
      kd_s: 0.0
      omega_is_rad_per_s: 0.0
      omega_ds_rad_per_s: 0.0
      ki2_per_s2: 0.0
      setpoint_v: 0.0
      offset_v: 0.0
      u_min_v: -0.5
      u_max_v: 0.5
      toggles: {feedback: true, p_term: false, i_term: true, d_term: false}
  - block: dac
    name: dac2s
    params:
      in: ctrl.pid2s.u
      out: v.dac2s
      device: fpga_generic
      bits: 16
      range_v: [-0.5, 0.5]
      noise_vrms: 0.0
      r_out_ohm: 50.0
      r_load_ohm: .inf
      toggles: {quantization: true, noise: false, saturation: true}
  - block: delay_buffer
    name: dl2s
    params: {in: v.dac2s, out: delay.dl2s.out, tau_s: !expr "1.0e-6 - 1 / run.f_sim_hz", method: linear}   # as dl2
  - block: pzt_fiber_stretcher
    name: fs2
    params:
      in: delay.dl2s.out
      gain_mode: direct
      k_rad_per_v: !expr "offline.params.lo_fs_range_rad / 0.5"
      polarity: 1.0
      modes: [{f_hz: !expr "offline.params.lo_fs_f_res_hz", q: !expr "offline.params.lo_fs_q", r: 1.0}]
      discretisation: tustin
      prewarp_hz: !expr "offline.params.lo_fs_f_res_hz"
      drive_min_v: -0.5
      drive_max_v: 0.5
      hysteresis_frac: 0.0
      segment: LO_fs
      driver: stretcher
      n_sub: 1
      sub: [0, 1]
      ring_len: 0
      insertion_loss_lin: 1.0          # on the LO (0 dB, toggle off; a null would be stripped from an overlay-added block)
      loss_applies_to: [lo]            # LO path (toggle off): no loss on the squeezed light
      loss_source: "LO fibre stretcher (offload), not on the squeezed path"
      toggles: {resonance: true, hysteresis: false, saturation: true, insertion_loss: false}
