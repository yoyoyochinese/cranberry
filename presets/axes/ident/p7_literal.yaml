# P7 literal (Kashiwazaki et al. 2023 p.4; notes/lit-kashiwazaki2023.md §0-4, §5.1 (A)) for the F_* presets, port 0
# (D85-7): the fast loop's controller is replaced by the analyser while the slow loop holds the lock. Needs a waveform
# overlay (ident/in_lock_stepped or ident/in_lock_multisine).
#
#   v.adc0 ─► pid0f (feedback OFF: u = 0) ─► sup0 ─► (0 + x) ─► ctrl.ident.u0 ─► dac0f ─► … ─► PZT ─┐
#   v.adc0 ─► pid0s (REWIRED: reads the error) ─► TEC ───────────────────────────────────────────────┤
#   v.adc0 ◄─────────────────────────────────── Liu fringe ◄────────────────────────────────────────┘
#
# Rewiring (the reason for this overlay): in F_common the TEC stage reads the fast stage's output (offload, T16 §4.4),
# so opening the fast stage would also starve the slow one. Here pid0s reads the error v.adc0 directly, with the
# integral gain re-designed for a hold loop through the TEC path, K_i = 2π f_hold / (liu_k_v · tec_k_rad_per_v_0)
# (same sign as pid0f: both actuators raise the phase for a positive drive), i.e. L_hold = ω_h/(s(1 + sτ_th)) with
# ω_h = 2π·ident_hold_f_hz and the TEC lag τ_th = tec_tau_th_s.
#
# Hold frequency (Phase 5 review I-5): ident_hold_f_hz is its own parameter. Validity condition: the hold loop is a
# second-order system with damping ζ = 1/(2√(ω_h τ_th)), so ζ ≥ 0.5 needs ω_h τ_th ≤ 1, i.e. f_hold ≤ 1/(2π τ_th).
# Nominal f_hold = 0.5/(2π τ_th): ζ = 0.71, phase margin 66°, closed-loop time constant ≈ τ_th/0.455 (2–220 s over
# F_common's τ_th 1–100 s, the 100 Hz update of the slow stage adds < 1°). The first version tied f_hold to f_12
# (ident_hold_f_hz: !expr "offline.params.f_12_hz"), which over F_common's grid gave ζ = 0.036–3.6 (PM 4–89°): a
# point with f_12 > 1/(2π τ_th) rings (kept as a bad reading, D34: set ident_hold_f_hz to f_12_hz in an overlay).
# Either way the hold is much slower than a 0.65 s sweep, which therefore runs on the analyser's output offset (below);
# tests/integration/test_phase6_ident.py checks the sign and the settling of the hold with a short τ_th and a
# deliberate offset error (ident_offset_err_rad).
# The paper does not say where its slow PID took its input after box C replaced the fast PID (lit note §6,
# UNVERIFIED); this is one consistent reading.
#
# loop_identification (relation plant): P̂ = v.adc0 / x is the fast plant (DAC, latency, PZT mode, Liu fringe, ADC)
# times 1/(1 + L_hold) (≈ 1 above the hold band); L̂ = −P̂·C₁ with C₁ the fast controller of chk.lock_stability, and
# the comparison is with that check's fast path alone (model_stages first).
#
# Operating point: F locks start from X = 0 and the fast loop acquires X = +π/2 (F_common header, dX/du = +k_pzt).
# With pid0f open its output is its offset O (pid docstring), so O = (π/2)/k_pzt keeps the bias the fast loop
# held, as the analyser's output offset would on the bench; without it the fringe sits at its extremum (zero slope).
#
# Physics caveat (kept as a configuration, D34): the TEC hold (lag tec_tau_th_s, update every tec_rate_div samples)
# can only hold well below 1 Hz: the operating point is held by the bias alone over a sweep, so a drift larger than in
# F_wg6_nominal over 0.65 s (where L̂ still matched within ≈ 4 %) moves the fringe slope and biases P̂; compare runs with
# and without the noise sources, and lengthen the sweep with care. In the paper the slow stage
# was a fibre stretcher (an I loop of unstated bandwidth).
run:
  duration_s: !expr "offline.params.ident_duration_s"
offline:
  params:
    ident_f_lo_hz: 200.0
    ident_f_hi_hz: 5.0e+4
    ident_amplitude: !expr "0.02 / offline.params.pzt_k_rad_per_v"   # 20 mrad of PZT phase per volt of x [AE]
    ident_amp_f_corner_hz: .inf
    ident_t_start_s: 0.02
    ident_min_amplitude_lsb: 4.0      # CHK ident_amplitude_lsb below 4 DAC LSB (Phase 5 review I-6: 1.3 LSB → 6.9 % on dsc1) [AE]
    ident_hold_f_hz: !expr "0.5 / (2 * pi * offline.params.tec_tau_th_s)"   # ζ = 0.71; valid while ≤ 1/(2π τ_th) (header, I-5)
    ident_offset_err_rad: 0.0         # error of the analyser's output offset against the held point (test knob; header)
  blocks:
    - block: loop_identification
      name: ident
      params:
        excitation: ident.exc
        x: ctrl.ident.exc.x
        response: v.adc0
        relation: plant
        controller: model             # C₁ of chk.lock_stability (the fast stage's design law)
        model: chk.lock_stability
        model_stages: first
        coherence_min: !expr "offline.params.ident_coherence_min"
        n_blocks: !expr "offline.params.ident_n_blocks"
        dac_lsb: !expr "2 * offline.params.out_range_v / 2 ** offline.params.dac_bits"   # x is in DAC input volts (I-6)
        min_amplitude_lsb: !expr "offline.params.ident_min_amplitude_lsb"
pipeline:
  - name: lock0.stack
    stack:
      stages:
        - name: stage0f
          seq:
            - name: pid0f
              params:
                toggles: {feedback: false}   # the analyser replaces the fast controller
                offset_v: !expr "(pi / 2 + offline.params.ident_offset_err_rad) / offline.params.pzt_k_rad_per_v"   # keeps X = +π/2 (+ error)
            - block: excitation        # appended after sup0 (keyed merge)
              name: ident.exc
              params:
                in: ctrl.sup0.u
                out: ctrl.ident.u0
                unit: V
                waveform: !expr "offline.params.ident_waveform"
                f_start_hz: !expr "offline.params.ident_f_lo_hz"
                f_stop_hz: !expr "offline.params.ident_f_hi_hz"
                n_freqs: !expr "offline.params.ident_n_freqs"
                spacing: log
                dwell_s: !expr "offline.params.ident_dwell_s"
                period_s: !expr "offline.params.ident_period_s"
                settle_s: !expr "offline.params.ident_settle_s"
                amp_f_corner_hz: !expr "offline.params.ident_amp_f_corner_hz"
                amplitude: !expr "offline.params.ident_amplitude"
                t_start_s: !expr "offline.params.ident_t_start_s"
                toggles: {enabled: true}
        - name: pid0s
          params:
            in: v.adc0
            ki_per_s: !expr "2 * pi * offline.params.ident_hold_f_hz / (offline.params.liu_k_v * offline.params.tec_k_rad_per_v_0)"
      actuators:
        - name: act0f
          seq:
            - name: dac0f
              params: {in: ctrl.ident.u0}
measure:
  record:
    decim: 2
    antialias: none
  loop_identification:
    lock0: {block: ident}
