# Probe axis: heterodyne detection of the Liu probe (D40 detection scheme; liu_probe_interferometer mode heterodyne,
# T14 §8; Phase 5 M6-10). The probe is shifted by f_shift (AOM) against the reference and the beat at det_k is
# demodulated with φ_d = 0: I = K cos X (X = φ_pr − φ_ref), the same side-of-fringe error as the DC homodyne (lock at
# X = π/2, slope −K) but free of DC offsets, with the demodulator's low pass inside the loop (its lag is not in
# chk.lock_stability: keep liu_demod_lpf_hz ≫ f_u). Sensor noise: white near the carrier, ×2 after demodulation (T14 §2.2).
offline:
  params:
    liu_f_shift_hz: 8.0e+7         # AOM shift [AE] (80 MHz class, as probe/freq_80MHz); F_common's probe_freq_offset_hz
                                   # = probe_line_offset_hz + liu_f_shift_hz, so the probe beam carries the shift
    liu_demod_lpf_hz: 3.0e+5       # [AE] ≫ f_u, < f_N = 500 kHz
# G-5 (Phase 6 fix): the beat has its own key, so probe/freq_* (which set the probe LINE probe_line_offset_hz) compose
# in either order. The reference ref_k is put on the probe line (it comes from the same line as the probe, which the
# AOM shifts by liu_f_shift_hz): P3's "1 THz WDM probe + 160 MHz heterodyne" = probe/freq_1THz + this overlay (+ set
# liu_f_shift_hz: 1.6e+8). Only the beams' frequency offsets move: like probe/freq_*, the thermal 2πΔν·κ_τ·L term is
# applied on the long port spools (probe), not on the 1–2 m reference branch (≤ 0.5 rad/K at 1 THz, neglected).
topology:
  beams:
    - {id: ref0, freq_offset_hz: !expr "offline.params.probe_line_offset_hz"}
    - {id: ref1, freq_offset_hz: !expr "offline.params.probe_line_offset_hz"}
pipeline:
  - !replace
    name: liu0
    seq:
      - block: liu_probe_interferometer
        name: liu0
        params:
          mode: heterodyne
          in_pr: beam.pr0.phi
          in_ref: beam.ref0.phi
          out: v.liu0
          p_pr_avg_w: !expr "offline.params.p_pr_avg_w"
          p_ref_w: !expr "offline.params.p_ref_w"
          duty: !expr "offline.params.probe_duty"
          visibility: !expr "offline.params.liu_visibility"
          coupler_sign: 1.0
          f_shift_hz: !expr "offline.params.liu_f_shift_hz"
          responsivity_a_per_w: !expr "offline.params.liu_responsivity_a_per_w"
          gain_v_per_a: !expr "offline.params.liu_gain_v_per_a"
          i_n_a_rthz: !expr "offline.params.liu_i_n_a_rthz"
          toggles: {shot_noise: true, electronic_noise: true, gating: true, rf_rate_mode: false}
      - block: demodulator
        name: dem0
        params:
          in: v.liu0
          in_phase: null
          out_i: dem.dem0.i
          out_q: dem.dem0.q
          lpf_order: 1
          f_ref_hz: !expr "offline.params.liu_f_shift_hz"
          phi_d_rad: 0.0               # I = a = K cos X
          v_off_v: 0.0
          lpf_hz: !expr "offline.params.liu_demod_lpf_hz"
          toggles: {rf_rate_mode: false, demod_offset: false, rf_reference_phase_noise: false}
  - !replace
    name: liu1
    seq:
      - block: liu_probe_interferometer
        name: liu1
        params:
          mode: heterodyne
          in_pr: beam.pr1.phi
          in_ref: beam.ref1.phi
          out: v.liu1
          p_pr_avg_w: !expr "offline.params.p_pr_avg_w"
          p_ref_w: !expr "offline.params.p_ref_w"
          duty: !expr "offline.params.probe_duty"
          visibility: !expr "offline.params.liu_visibility"
          coupler_sign: 1.0
          f_shift_hz: !expr "offline.params.liu_f_shift_hz"
          responsivity_a_per_w: !expr "offline.params.liu_responsivity_a_per_w"
          gain_v_per_a: !expr "offline.params.liu_gain_v_per_a"
          i_n_a_rthz: !expr "offline.params.liu_i_n_a_rthz"
          toggles: {shot_noise: true, electronic_noise: true, gating: true, rf_rate_mode: false}
      - block: demodulator
        name: dem1
        params:
          in: v.liu1
          in_phase: null
          out_i: dem.dem1.i
          out_q: dem.dem1.q
          lpf_order: 1
          f_ref_hz: !expr "offline.params.liu_f_shift_hz"
          phi_d_rad: 0.0               # I = a = K cos X
          v_off_v: 0.0
          lpf_hz: !expr "offline.params.liu_demod_lpf_hz"
          toggles: {rf_rate_mode: false, demod_offset: false, rf_reference_phase_noise: false}
  - name: in_bw0                     # the controller input (F_common in_bw0 → adc0, G-3)
    params: {in: dem.dem0.i}
  - name: in_bw1                     # the controller input (F_common in_bw1 → adc1, G-3)
    params: {in: dem.dem1.i}
