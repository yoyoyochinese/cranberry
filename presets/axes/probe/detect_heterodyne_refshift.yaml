# Probe axis: heterodyne detection of the Liu probe with the AOM shift on the REFERENCE arm (Phase 6 WP6-X item 4; D40
# detection scheme; liu_probe_interferometer mode heterodyne, T14 §8; Phase 5 M6-10). Same detector chain as
# probe/detect_heterodyne (block for block), but that overlay writes probe_freq_offset_hz := liu_f_shift_hz, so it
# overwrites the offset of a probe/freq_* overlay applied before it (with freq_1THz the probe silently becomes an 80 MHz
# probe: path-model coefficients and stray-light table). Here the probe keeps its own offset Δν (probe_freq_offset_hz,
# 0 or the value of probe/freq_*, in either overlay order) and the reference beams carry Δν − f_shift, i.e. the
# reference is taken from the probe source and shifted by −f_shift with an AOM, so probe and reference beat at f_shift.
# probe/detect_heterodyne stays unchanged (D34: its probe-side AOM is the other wiring).
# The reference's offset only enters its static phase 2π f_off τ_b (absorbed in the lock point) and nothing else in
# F_common (its REF / REF_k coefficients are wildcard); the demodulator, the sensor noise (white near the carrier, ×2
# after demodulation, T14 §2.2) and the loop are those of probe/detect_heterodyne. Keep liu_demod_lpf_hz ≫ f_u.
offline:
  params:
    liu_f_shift_hz: 8.0e+7         # AOM shift [AE] (80 MHz class, as probe/detect_heterodyne)
    liu_demod_lpf_hz: 3.0e+5       # [AE] ≫ f_u, < f_N = 500 kHz (as probe/detect_heterodyne)
topology:
  beams:
    - {id: ref0, freq_offset_hz: !expr "offline.params.probe_freq_offset_hz - offline.params.liu_f_shift_hz"}
    - {id: ref1, freq_offset_hz: !expr "offline.params.probe_freq_offset_hz - offline.params.liu_f_shift_hz"}
pipeline:
  - !replace
    name: liu0
    seq:
      - block: liu_probe_interferometer
        name: liu0
        params:
          mode: heterodyne
          in_pr: beam.pr0.phi
          in_ref: beam.ref0.phi
          out: v.liu0
          p_pr_avg_w: !expr "offline.params.p_pr_avg_w"
          p_ref_w: !expr "offline.params.p_ref_w"
          duty: !expr "offline.params.probe_duty"
          visibility: !expr "offline.params.liu_visibility"
          coupler_sign: 1.0
          f_shift_hz: !expr "offline.params.liu_f_shift_hz"
          responsivity_a_per_w: !expr "offline.params.liu_responsivity_a_per_w"
          gain_v_per_a: !expr "offline.params.liu_gain_v_per_a"
          i_n_a_rthz: !expr "offline.params.liu_i_n_a_rthz"
          toggles: {shot_noise: true, electronic_noise: true, gating: true, rf_rate_mode: false}
      - block: demodulator
        name: dem0
        params:
          in: v.liu0
          in_phase: null
          out_i: dem.dem0.i
          out_q: dem.dem0.q
          lpf_order: 1
          f_ref_hz: !expr "offline.params.liu_f_shift_hz"
          phi_d_rad: 0.0               # I = a = K cos X
          v_off_v: 0.0
          lpf_hz: !expr "offline.params.liu_demod_lpf_hz"
          toggles: {rf_rate_mode: false, demod_offset: false, rf_reference_phase_noise: false}
  - !replace
    name: liu1
    seq:
      - block: liu_probe_interferometer
        name: liu1
        params:
          mode: heterodyne
          in_pr: beam.pr1.phi
          in_ref: beam.ref1.phi
          out: v.liu1
          p_pr_avg_w: !expr "offline.params.p_pr_avg_w"
          p_ref_w: !expr "offline.params.p_ref_w"
          duty: !expr "offline.params.probe_duty"
          visibility: !expr "offline.params.liu_visibility"
          coupler_sign: 1.0
          f_shift_hz: !expr "offline.params.liu_f_shift_hz"
          responsivity_a_per_w: !expr "offline.params.liu_responsivity_a_per_w"
          gain_v_per_a: !expr "offline.params.liu_gain_v_per_a"
          i_n_a_rthz: !expr "offline.params.liu_i_n_a_rthz"
          toggles: {shot_noise: true, electronic_noise: true, gating: true, rf_rate_mode: false}
      - block: demodulator
        name: dem1
        params:
          in: v.liu1
          in_phase: null
          out_i: dem.dem1.i
          out_q: dem.dem1.q
          lpf_order: 1
          f_ref_hz: !expr "offline.params.liu_f_shift_hz"
          phi_d_rad: 0.0               # I = a = K cos X
          v_off_v: 0.0
          lpf_hz: !expr "offline.params.liu_demod_lpf_hz"
          toggles: {rf_rate_mode: false, demod_offset: false, rf_reference_phase_noise: false}
  - name: adc0
    params: {in: dem.dem0.i}
  - name: adc1
    params: {in: dem.dem1.i}
